plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

// رقم الإصدار يأتي من الـ build تلقائياً: gradle assembleDebug -Pvc=1005
// (إذا ما مُرِّر يستخدم 3)
def appVersionCode = (project.findProperty('vc') ?: '3').toString().toInteger()

android {
    namespace 'com.niyati.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.niyati.tv'
        minSdk 23
        targetSdk 35
        versionCode appVersionCode
        versionName "1.${appVersionCode}"
    }

    // توقيع ثابت: يخلي التحديث يثبت فوق النسخة القديمة بدون حذفها
    signingConfigs {
        niyati {
            storeFile file('niyati.keystore')
            storePassword 'niyati123'
            keyAlias 'niyati'
            keyPassword 'niyati123'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.niyati
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.niyati
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-database'

    // QR code (Telegram card on the TV)
    implementation 'com.google.zxing:core:3.5.3'

    // Media3 / ExoPlayer
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'

    // HLS / M3U8
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'

    // DASH / MPD
    implementation 'androidx.media3:media3-exoplayer-dash:1.5.1'

    // SmoothStreaming / ISM
    implementation 'androidx.media3:media3-exoplayer-smoothstreaming:1.5.1'
}
