# ===== خطوتان تُعدَّلان بملف الـ workflow (المجلد .github/workflows) =====
# 1) غيّر أمر البناء ليأخذ رقم الإصدار من رقم تشغيل GitHub (يزيد تلقائياً كل مرة):
#
#   قبل:  run: gradle assembleDebug
#   بعد:  run: gradle assembleDebug -Pvc=$((1000 + GITHUB_RUN_NUMBER))
#
# 2) أضف هذه الخطوة بعد خطوة البناء (بنفس المحاذاة). تفشل إذا لم يطابق توقيع الـ APK مفتاح niyati:

      - name: Verify signing
        run: |
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          KS=$(keytool -list -v -keystore app/niyati.keystore -storepass niyati123 | grep "SHA256:" | head -1 | sed 's/.*SHA256: //' | tr -d ':' | tr 'A-F' 'a-f')
          AP=$($BT/apksigner verify --print-certs "$APK" | grep "certificate SHA-256 digest" | head -1 | sed 's/.*: //')
          echo "keystore = $KS"
          echo "apk      = $AP"
          echo "versionCode = $($BT/aapt2 dump badging "$APK" | grep -o "versionCode='[0-9]*'")"
          [ "$KS" = "$AP" ] || { echo "SIGNING MISMATCH: the APK is not signed with niyati.keystore"; exit 1; }
