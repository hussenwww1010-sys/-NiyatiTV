<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>NIYATI CLOUD - Import</title>

<style>

*{box-sizing:border-box}

body{margin:0;padding:20px;background:#080d1d;color:#fff;font-family:Arial,sans-serif}

.container{max-width:650px;margin:25px auto;background:#131c32;border:1px solid #263653;border-radius:16px;padding:20px}

h2{color:#00d9ff;text-align:center}

p{color:#b8c6dc;line-height:1.8}

label{display:block;margin:15px 0 7px}

input{width:100%;padding:13px;border-radius:9px;border:1px solid #344766;background:#080f20;color:white}

button{width:100%;padding:14px;margin-top:14px;border:0;border-radius:9px;background:#00bfe8;color:#00111b;font-size:16px;font-weight:bold}

button:disabled{opacity:.5}

#log{background:#080f20;border:1px solid #344766;padding:13px;border-radius:9px;margin-top:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;min-height:70px}

.small{font-size:13px;color:#9aabc4}

</style>

</head>

<body>

<div class="container">

<h2>NIYATI CLOUD</h2>

<p>استيراد نسخة Firebase الكاملة إلى قاعدة بيانات Cloudflare D1.</p>

<label>رابط Worker</label>

<input id="worker" value="https://niyati-cloud-api.hussenwww1010.workers.dev">

<label>ADMIN_TOKEN</label>

<input id="token" type="password" placeholder="أدخل الرمز السري">

<label>ملف Firebase JSON</label>

<input id="file" type="file" accept=".json,application/json">

<button id="test" onclick="testConnection()">اختبار الاتصال</button>

<button id="import" onclick="importData()">استيراد النسخة كاملة</button>

<div id="log">بانتظار العملية...</div>

<p class="small">لا تغلق الصفحة أثناء الاستيراد. لا تشارك رمز ADMIN_TOKEN مع أي شخص.</p>

</div>

<script>

const $ = id => document.getElementById(id);

function base(){

  return $("worker").value.trim().replace(/\/+$/,"");

}

function headers(){

  return {

    "Authorization":"Bearer "+$("token").value.trim()

  };

}

function log(s){

  $("log").textContent=s;

}

async function testConnection(){

  const b=base();

  if(!b || !$("token").value.trim()){

    log("أدخل رابط Worker والرمز السري أولاً.");

    return;

  }

  $("test").disabled=true;

  log("جارٍ اختبار الاتصال...");

  try{

    const r=await fetch(b+"/admin/ping",{headers:headers()});

    const data=await r.json();

    if(!r.ok) throw new Error(data.error||("HTTP "+r.status));

    log("✓ الاتصال ناجح\n"+JSON.stringify(data,null,2));

  }catch(e){

    log("فشل الاتصال: "+e.message);

  }finally{

    $("test").disabled=false;

  }

}

async function importData(){

  const file=$("file").files[0];

  if(!file){

    log("اختَر ملف Firebase JSON أولاً.");

    return;

  }

  if(!$("token").value.trim()){

    log("أدخل ADMIN_TOKEN أولاً.");

    return;

  }

  if(!confirm("سيتم استبدال البيانات الموجودة في Cloudflare بالكامل بمحتويات ملف Firebase. هل تريد المتابعة؟")){

    return;

  }

  $("import").disabled=true;

  $("test").disabled=true;

  log("جارٍ قراءة الملف...");

  try{

    const root=JSON.parse(await file.text());

    if(!root || typeof root!=="object" || Array.isArray(root)){

      throw new Error("الملف ليس كائن Firebase رئيسياً صحيحاً.");

    }

    const sections=Object.keys(root);

    if(!sections.length) throw new Error("الملف فارغ.");

    log("الأقسام الموجودة:\n"+sections.join("، ")+"\n\nجارٍ إرسال الملف كاملاً بطلب واحد...");

    const response=await fetch(base()+"/admin/import",{

      method:"POST",

      headers:{

        ...headers(),

        "Content-Type":"application/json"

      },

      body:JSON.stringify(root)

    });

    const result=await response.json();

    if(!response.ok) throw new Error(result.error||("HTTP "+response.status));

    if(!result.ok || !result.imported) throw new Error("لم يؤكد Worker نجاح الاستيراد.");

    log("✓ تم إرسال النسخة كاملة بنجاح\n"+

        "عدد الأقسام: "+result.sections+

        "\nإصدار قاعدة البيانات: "+result.version+

        "\n\nالخطوة التالية: نتحقق من القنوات عبر النسخة الاحتياطية.");

  }catch(e){

    log("❌ فشل الاستيراد:\n"+e.message);

  }finally{

    $("import").disabled=false;

    $("test").disabled=false;

  }

}

</script>

</body>

</html>
