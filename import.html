<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>NIYATI CLOUD</title>

<style>

*{box-sizing:border-box}

body{margin:0;padding:16px;background:#080d1d;color:white;font-family:Arial}

.container{max-width:650px;margin:20px auto;background:#131c32;border:1px solid #263653;border-radius:16px;padding:20px}

h2{text-align:center;color:#00d9ff}

p{color:#b8c6dc;line-height:1.8}

label{display:block;margin:15px 0 7px}

input{width:100%;padding:13px;border-radius:9px;border:1px solid #344766;background:#080f20;color:white}

button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:9px;background:#00bfe8;color:#00111b;font-size:15px;font-weight:bold}

button:disabled{opacity:.5}

.secondary{background:#263b59;color:white}

#log{background:#080f20;border:1px solid #344766;padding:13px;border-radius:9px;margin-top:16px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;min-height:70px}

.small{font-size:12px;color:#9aabc4}

</style>

</head>

<body>

<div class="container">

<h2>NIYATI CLOUD</h2>

<p>لوحة إدارة واستيراد وفحص قاعدة بيانات NIYATI CLOUD.</p>

<label>رابط Worker</label>

<input id="worker" value="https://niyati-cloud-api.hussenwww1010.workers.dev">

<label>ADMIN_TOKEN</label>

<input id="token" type="password" placeholder="أدخل الرمز السري">

<label>ملف Firebase JSON</label>

<input id="file" type="file" accept=".json,application/json">

<button onclick="testConnection()">اختبار الاتصال</button>

<button onclick="importData()">استيراد النسخة كاملة</button>

<button class="secondary" onclick="checkChannels()">فحص القنوات</button>

<button class="secondary" onclick="downloadBackup()">تنزيل نسخة احتياطية</button>

<div id="log">بانتظار العملية...</div>

<p class="small">احتفظ برمز ADMIN_TOKEN سرياً ولا تشاركه مع أي شخص.</p>

</div>

<script>

const $=id=>document.getElementById(id);

function base(){return $("worker").value.trim().replace(/\/+$/,"")}

function headers(){

 return {"Authorization":"Bearer "+$("token").value.trim()};

}

function log(s){$("log").textContent=s}

function checkInputs(){

 if(!base()||!$("token").value.trim()){

  log("أدخل رابط Worker والرمز السري أولاً.");

  return false;

 }

 return true;

}

async function request(path,options={}){

 const response=await fetch(base()+path,{

  ...options,

  headers:{...headers(),...(options.headers||{})}

 });

 const data=await response.json();

 if(!response.ok)throw new Error(data.error||"HTTP "+response.status);

 return data;

}

async function testConnection(){

 if(!checkInputs())return;

 log("جارٍ اختبار الاتصال...");

 try{

  const data=await request("/admin/ping");

  log("✓ الاتصال ناجح\n"+JSON.stringify(data,null,2));

 }catch(e){log("❌ "+e.message)}

}

async function importData(){

 if(!checkInputs())return;

 const file=$("file").files[0];

 if(!file){log("اختَر ملف Firebase أولاً.");return}

 if(!confirm("سيتم استبدال بيانات Cloudflare بالكامل ببيانات الملف. هل تريد المتابعة؟"))return;

 log("جارٍ قراءة الملف...");

 try{

  const root=JSON.parse(await file.text());

  if(!root||typeof root!=="object"||Array.isArray(root))throw new Error("ملف Firebase غير صحيح");

  const sections=Object.keys(root);

  log("جارٍ إرسال النسخة كاملة بطلب واحد...");

  const result=await request("/admin/import",{

   method:"POST",

   headers:{"Content-Type":"application/json"},

   body:JSON.stringify(root)

  });

  if(!result.ok||!result.imported)throw new Error("لم يؤكد Worker نجاح الاستيراد");

  log("✓ تم الاستيراد بنجاح\nالأقسام: "+sections.join("، ")+"\nعدد الأقسام: "+result.sections+"\nالإصدار: "+result.version);

 }catch(e){log("❌ فشل الاستيراد:\n"+e.message)}

}

async function checkChannels(){

 if(!checkInputs())return;

 log("جارٍ فحص بيانات القنوات...");

 try{

  const root=await request("/admin/db");

  const channels=root.channels;

  if(!channels||typeof channels!=="object"){

   log("لم يتم العثور على قسم channels في قاعدة البيانات.");

   return;

  }

  const entries=Object.entries(channels);

  const sample=entries.slice(0,10).map(([id,c])=>

   (c.name||id)+" | "+(c.url?"رابط موجود":"لا يوجد رابط")

  );

  log("✓ تم فحص القنوات\nعدد القنوات: "+entries.length+"\n\nأول القنوات:\n"+sample.join("\n"));

 }catch(e){log("❌ فشل الفحص:\n"+e.message)}

}

async function downloadBackup(){

 if(!checkInputs())return;

 log("جارٍ تنزيل النسخة الاحتياطية...");

 try{

  const root=await request("/admin/db");

  const blob=new Blob([JSON.stringify(root,null,2)],{type:"application/json"});

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");

  a.href=url;

  a.download="niyati-cloud-backup.json";

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

  log("✓ تم تجهيز النسخة الاحتياطية للتنزيل.\nحجم البيانات: "+Object.keys(root).length+" أقسام.");

 }catch(e){log("❌ فشل تنزيل النسخة:\n"+e.message)}

}

</script>

</body>

</html>
