<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Niyati TV</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #080b12;
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            height: 80px;
            display: flex;
            align-items: center;
            padding: 0 35px;
            background: #10151f;
            border-bottom: 1px solid #202735;
        }

        .logo {
            width: 50px;
            height: 50px;
            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #ff1744,
                    #ff5c7a
                );

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 21px;
            font-weight: bold;
        }

        .title {
            margin-right: 15px;
        }

        .title h1 {
            font-size: 23px;
        }

        .title span {
            color: #9299a8;
            font-size: 12px;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            flex: 1;
            display: flex;
            padding: 25px;
            gap: 25px;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 230px;
            flex-shrink: 0;

            background: #10151f;

            border-radius: 18px;

            padding: 20px;
        }

        .sidebar h2 {
            font-size: 17px;
            margin-bottom: 18px;
            color: #b8bfcd;
        }

        #packages {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .package {
            width: 100%;

            padding: 15px;

            border: 0;
            border-radius: 12px;

            background: #171d28;

            color: white;

            text-align: right;

            cursor: pointer;

            font-size: 15px;

            transition: 0.2s;
        }

        .package:hover,
        .package:focus {
            outline: none;

            background: #252d3b;

            transform: scale(1.02);
        }

        .package.active {
            background: #e91542;
        }

        /* =========================
           CONTENT
        ========================= */

        .content {
            flex: 1;
            min-width: 0;
        }

        .content h2 {
            margin-bottom: 20px;
            font-size: 22px;
        }

        /* =========================
           CHANNELS
        ========================= */

        .channels {
            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(180px, 1fr)
                );

            gap: 15px;
        }

        .channel {
            min-height: 115px;

            background: #111722;

            border: 2px solid transparent;

            border-radius: 16px;

            padding: 20px;

            cursor: pointer;

            transition: 0.2s;
        }

        .channel:hover,
        .channel:focus {
            outline: none;

            border-color: #e91542;

            transform: translateY(-2px);

            background: #151c28;
        }

        .channel.selected {
            border-color: #e91542;
        }

        .channel-logo {
            width: 45px;
            height: 45px;

            border-radius: 12px;

            background: #202735;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-bottom: 12px;

            font-weight: bold;
        }

        .channel-name {
            font-size: 14px;
            font-weight: bold;
            line-height: 1.4;
        }

        /* =========================
           EMPTY
        ========================= */

        .empty {
            padding: 40px;

            color: #9299a8;

            text-align: center;
        }

        /* =========================
           PLAYER
        ========================= */

        .player {
            display: none;

            position: fixed;

            inset: 0;

            background: #000;

            z-index: 9999;

            align-items: center;
            justify-content: center;
        }

        .player video {
            width: 100%;
            height: 100%;

            object-fit: contain;
        }

        .close {
            position: absolute;

            top: 20px;
            right: 25px;

            z-index: 10000;

            background: rgba(0,0,0,.75);

            color: white;

            border: 0;

            border-radius: 10px;

            padding: 12px 20px;

            font-size: 15px;

            cursor: pointer;
        }

        .close:focus {
            outline: 2px solid #e91542;
        }

        /* =========================
           MOBILE
        ========================= */

        @media(max-width:700px) {

            main {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
            }

            #packages {
                display: grid;

                grid-template-columns:
                    repeat(2, 1fr);
            }

            .channels {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <div class="logo">
            NT
        </div>

        <div class="title">

            <h1>
                Niyati TV
            </h1>

            <span>
                IPTV Platform
            </span>

        </div>

    </header>



    <!-- =========================
         MAIN
    ========================= -->

    <main>


        <!-- =========================
             PACKAGES
        ========================= -->

        <aside class="sidebar">

            <h2>
                الباقات
            </h2>

            <div id="packages"></div>

        </aside>



        <!-- =========================
             CHANNELS
        ========================= -->

        <section class="content">

            <h2 id="packageTitle">
                اختر باقة
            </h2>

            <div
                class="channels"
                id="channels">

            </div>

        </section>


    </main>


</div>



<!-- =========================
     PLAYER
========================= -->

<div
    class="player"
    id="player"
>


    <button
        class="close"
        id="closePlayer"
        type="button"
    >

        رجوع

    </button>


    <video
        id="video"
        playsinline
        controls
    ></video>


</div>



<!-- =========================
     CHANNEL DATABASE
========================= -->

<script src="channels.js"></script>


<!-- =========================
     PLAYER JS
========================= -->

<script src="player.js"></script>



<script>

"use strict";


/* =========================
   ELEMENTS
========================= */

const packagesContainer =
    document.getElementById("packages");

const channelsContainer =
    document.getElementById("channels");

const packageTitle =
    document.getElementById("packageTitle");

const player =
    document.getElementById("player");

const video =
    document.getElementById("video");

const closePlayerButton =
    document.getElementById("closePlayer");



/* =========================
   CHECK CHANNEL DATABASE
========================= */

if (
    typeof channels === "undefined" ||
    !Array.isArray(channels)
) {

    channelsContainer.innerHTML = `
        <div class="empty">
            خطأ: لم يتم تحميل channels.js
        </div>
    `;

    console.error(
        "channels.js was not loaded."
    );

} else {


    /* =========================
       GET PACKAGES
    ========================= */

    const packageNames = [
        ...new Set(
            channels
                .map(channel => channel.package)
                .filter(Boolean)
        )
    ];


    /* =========================
       CREATE PACKAGES
    ========================= */

    packageNames.forEach(
        (packageName, index) => {

            const button =
                document.createElement("button");

            button.className =
                "package";

            button.type =
                "button";

            button.tabIndex =
                0;

            button.textContent =
                packageName;


            button.addEventListener(
                "click",
                () => {

                    selectPackage(
                        packageName
                    );

                }
            );


            button.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key === "Enter" ||
                        event.key === " "
                    ) {

                        event.preventDefault();

                        selectPackage(
                            packageName
                        );

                    }

                }
            );


            packagesContainer.appendChild(
                button
            );

        }
    );



    /* =========================
       SELECT PACKAGE
    ========================= */

    function selectPackage(packageName) {


        packageTitle.textContent =
            packageName;


        channelsContainer.innerHTML =
            "";


        document
            .querySelectorAll(".package")
            .forEach(button => {

                button.classList.remove(
                    "active"
                );

            });


        const selectedPackage =
            [...document.querySelectorAll(".package")]
                .find(
                    button =>
                        button.textContent ===
                        packageName
                );


        if (selectedPackage) {

            selectedPackage.classList.add(
                "active"
            );

        }



        /* =========================
           FILTER CHANNELS
        ========================= */

        const packageChannels =
            channels.filter(
                channel =>
                    channel.package ===
                    packageName
            );


        if (
            packageChannels.length === 0
        ) {

            channelsContainer.innerHTML = `
                <div class="empty">
                    لا توجد قنوات في هذه الباقة
                </div>
            `;

            return;

        }



        /* =========================
           CREATE CHANNEL CARDS
        ========================= */

        packageChannels.forEach(
            (channel, index) => {


                const card =
                    document.createElement("div");


                card.className =
                    "channel";


                card.tabIndex =
                    0;


                card.innerHTML = `

                    <div class="channel-logo">
                        ${index + 1}
                    </div>

                    <div class="channel-name">
                        ${channel.name}
                    </div>

                `;


                /* =========================
                   MOUSE / TOUCH
                ========================= */

                card.addEventListener(
                    "click",
                    () => {

                        openChannel(
                            channel
                        );

                    }
                );


                /* =========================
                   TV REMOTE
                ========================= */

                card.addEventListener(
                    "keydown",
                    event => {

                        if (
                            event.key ===
                            "Enter"
                        ) {

                            event.preventDefault();

                            openChannel(
                                channel
                            );

                        }

                    }
                );


                channelsContainer.appendChild(
                    card
                );

            }
        );


        /* =========================
           FOCUS FIRST CHANNEL
        ========================= */

        const firstChannel =
            channelsContainer.querySelector(
                ".channel"
            );


        if (firstChannel) {

            setTimeout(
                () => firstChannel.focus(),
                50
            );

        }

    }



    /* =========================
       OPEN CHANNEL
    ========================= */

    function openChannel(channel) {


        if (
            !channel.url ||
            channel.url.trim() === ""
        ) {

            alert(
                "رابط البث غير موجود لهذه القناة."
            );

            return;

        }


        player.style.display =
            "flex";


        video.src =
            channel.url;


        video.play().catch(
            error => {

                console.log(
                    "Playback:",
                    error
                );

            }
        );

    }



    /* =========================
       CLOSE PLAYER
    ========================= */

    function closePlayer() {


        video.pause();

        video.removeAttribute(
            "src"
        );

        video.load();


        player.style.display =
            "none";

    }



    /* =========================
       CLOSE BUTTON
    ========================= */

    closePlayerButton.addEventListener(
        "click",
        closePlayer
    );



    /* =========================
       KEYBOARD / TV REMOTE
    ========================= */

    document.addEventListener(
        "keydown",
        event => {


            /* Back / Escape */

            if (
                event.key === "Escape" ||
                event.key === "Backspace"
            ) {

                if (
                    player.style.display ===
                    "flex"
                ) {

                    event.preventDefault();

                    closePlayer();

                }

            }


            /* OK */

            if (
                event.key === "Enter"
            ) {

                const active =
                    document.activeElement;


                if (
                    active &&
                    active.classList.contains(
                        "channel"
                    )
                ) {

                    event.preventDefault();

                    active.click();

                }

            }

        }
    );



    /* =========================
       OPEN FIRST PACKAGE
    ========================= */

    if (
        packageNames.length > 0
    ) {

        selectPackage(
            packageNames[0]
        );

    } else {

        channelsContainer.innerHTML = `
            <div class="empty">
                لا توجد قنوات
            </div>
        `;

    }

}

</script>


</body>
</html>
