<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NIYATI TV | SPORTS IPTV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dashjs@5.0.0/dist/modern/umd/dash.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mpegts.js@1.8.0/dist/mpegts.min.js"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    background:#050505;
    color:#fff;
    font-family:Arial,Tahoma,sans-serif;
    overflow:hidden;
}

body{
    background:
        radial-gradient(circle at 80% 10%,rgba(212,170,70,.10),transparent 30%),
        linear-gradient(135deg,#050505,#0c0c0c 55%,#111 100%);
}

/* ================= HEADER ================= */

.header{
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
    border-bottom:1px solid rgba(212,170,70,.20);
    background:rgba(5,5,5,.92);
    backdrop-filter:blur(15px);
    position:relative;
    z-index:10;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logoMark{
    width:42px;
    height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:900;
    color:#050505;
    background:linear-gradient(135deg,#f7d774,#a97a16);
    box-shadow:0 0 22px rgba(212,170,70,.22);
}

.brandText{
    line-height:1.05;
}

.brandText strong{
    display:block;
    font-size:19px;
    letter-spacing:2px;
}

.brandText span{
    color:#c7a94d;
    font-size:10px;
    letter-spacing:2px;
}

.liveStatus{
    display:flex;
    align-items:center;
    gap:7px;
    color:#aaa;
    font-size:12px;
}

.liveDot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#28d17c;
    box-shadow:0 0 10px #28d17c;
}

/* ================= APP ================= */

.app{
    height:calc(100vh - 68px);
    display:grid;
    grid-template-columns:230px 1fr;
    min-height:0;
}

/* ================= SIDEBAR ================= */

.sidebar{
    border-left:1px solid rgba(255,255,255,.07);
    background:rgba(8,8,8,.92);
    padding:18px 12px;
    overflow-y:auto;
}

.sidebarTitle{
    color:#888;
    font-size:11px;
    margin:0 8px 12px;
    letter-spacing:1px;
}

.packageList{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.packageBtn{
    width:100%;
    border:1px solid transparent;
    background:rgba(255,255,255,.035);
    color:#aaa;
    border-radius:12px;
    padding:12px 13px;
    cursor:pointer;
    text-align:right;
    display:flex;
    align-items:center;
    gap:10px;
    transition:.2s;
}

.packageBtn:hover,
.packageBtn:focus{
    outline:none;
    background:rgba(212,170,70,.09);
    border-color:rgba(212,170,70,.35);
    color:#fff;
}

.packageBtn.active{
    background:linear-gradient(135deg,rgba(212,170,70,.22),rgba(212,170,70,.06));
    border-color:rgba(212,170,70,.55);
    color:#f4d67b;
}

.packageLogo{
    width:32px;
    height:32px;
    object-fit:contain;
    border-radius:8px;
    background:#111;
    flex:none;
}

.packageName{
    flex:1;
    font-size:13px;
    font-weight:bold;
}

.packageCount{
    font-size:10px;
    color:#777;
}

/* ================= CONTENT ================= */

.content{
    min-width:0;
    min-height:0;
    overflow:hidden;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:15px;
}

/* ================= PLAYER ================= */

.playerBox{
    position:relative;
    width:100%;
    height:45vh;
    min-height:260px;
    max-height:600px;
    background:#000;
    border-radius:18px;
    overflow:hidden;
    border:1px solid rgba(212,170,70,.20);
    box-shadow:
        0 20px 60px rgba(0,0,0,.45),
        inset 0 0 40px rgba(255,255,255,.015);
}

#video{
    width:100%;
    height:100%;
    display:block;
    background:#000;
    object-fit:contain;
}

.playerOverlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
}

.playerMessage{
    padding:15px 22px;
    border-radius:12px;
    background:rgba(0,0,0,.72);
    border:1px solid rgba(212,170,70,.25);
    color:#aaa;
    text-align:center;
    backdrop-filter:blur(10px);
}

.playerMessage strong{
    display:block;
    color:#e7c968;
    margin-bottom:5px;
}

.playerTop{
    position:absolute;
    top:14px;
    right:14px;
    left:14px;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.nowPlaying{
    max-width:70%;
    padding:8px 12px;
    border-radius:9px;
    background:rgba(0,0,0,.65);
    font-size:12px;
    color:#ddd;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.fullscreenBtn{
    pointer-events:auto;
    border:1px solid rgba(212,170,70,.4);
    background:rgba(0,0,0,.65);
    color:#e6c75d;
    border-radius:9px;
    padding:8px 12px;
    cursor:pointer;
}

.fullscreenBtn:hover{
    background:rgba(212,170,70,.16);
}

/* ================= CHANNEL HEADER ================= */

.sectionHead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.sectionHead h2{
    font-size:18px;
}

.sectionHead span{
    color:#777;
    font-size:11px;
}

/* ================= CHANNELS ================= */

.channels{
    min-height:0;
    overflow-y:auto;
    padding:2px 2px 20px;
}

.channelGrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:12px;
}

.channelCard{
    position:relative;
    min-height:145px;
    border:1px solid rgba(255,255,255,.07);
    background:
        linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
    border-radius:15px;
    padding:13px;
    cursor:pointer;
    transition:.2s;
    outline:none;
}

.channelCard:hover,
.channelCard:focus{
    transform:translateY(-2px);
    border-color:rgba(212,170,70,.48);
    background:
        linear-gradient(145deg,rgba(212,170,70,.11),rgba(255,255,255,.025));
    box-shadow:0 12px 35px rgba(0,0,0,.30);
}

.channelCard.active{
    border-color:#d4aa46;
    box-shadow:
        0 0 0 1px rgba(212,170,70,.22),
        0 12px 35px rgba(0,0,0,.3);
}

.channelLogoBox{
    height:76px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:10px;
}

.channelLogo{
    max-width:100%;
    max-height:70px;
    object-fit:contain;
}

.channelFallback{
    width:60px;
    height:60px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#d4aa46,#765511);
    color:#050505;
    font-size:20px;
    font-weight:900;
}

.channelName{
    font-size:13px;
    font-weight:bold;
    margin-bottom:8px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.qualityList{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

.qualityBtn{
    border:1px solid rgba(212,170,70,.25);
    background:rgba(212,170,70,.06);
    color:#cdb66e;
    border-radius:6px;
    padding:4px 7px;
    font-size:9px;
    cursor:pointer;
}

.qualityBtn:hover,
.qualityBtn:focus{
    outline:none;
    background:#d4aa46;
    color:#050505;
}

.qualityBtn.active{
    background:#d4aa46;
    color:#050505;
}

.noChannels{
    padding:40px 20px;
    text-align:center;
    color:#777;
    border:1px dashed rgba(255,255,255,.1);
    border-radius:15px;
}

/* ================= LOADING ================= */

.loading{
    text-align:center;
    padding:50px;
    color:#777;
}

.spinner{
    width:35px;
    height:35px;
    border:3px solid rgba(212,170,70,.15);
    border-top-color:#d4aa46;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 15px;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* ================= MOBILE ================= */

@media(max-width:800px){

    html,body{
        overflow:auto;
    }

    .header{
        height:60px;
        padding:0 12px;
    }

    .brandText strong{
        font-size:16px;
    }

    .brandText span{
        font-size:8px;
    }

    .liveStatus{
        display:none;
    }

    .app{
        height:auto;
        min-height:calc(100vh - 60px);
        display:block;
    }

    .sidebar{
        border:0;
        padding:10px;
        overflow:hidden;
    }

    .sidebarTitle{
        display:none;
    }

    .packageList{
        flex-direction:row;
        overflow-x:auto;
        padding-bottom:4px;
    }

    .packageBtn{
        width:auto;
        min-width:max-content;
        padding:8px 11px;
    }

    .packageLogo{
        width:26px;
        height:26px;
    }

    .packageCount{
        display:none;
    }

    .content{
        padding:10px;
        overflow:visible;
    }

    .playerBox{
        height:30vh;
        min-height:190px;
        border-radius:13px;
    }

    .channelGrid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:8px;
    }

    .channelCard{
        min-height:130px;
        padding:9px;
        border-radius:12px;
    }

    .channelLogoBox{
        height:58px;
    }

    .channelLogo{
        max-height:55px;
    }

    .channelFallback{
        width:45px;
        height:45px;
        font-size:16px;
    }

    .channelName{
        font-size:11px;
    }

    .qualityBtn{
        font-size:8px;
        padding:3px 5px;
    }
}

/* ================= FULLSCREEN ================= */

.playerBox:fullscreen{
    width:100vw;
    height:100vh;
    max-height:none;
    border-radius:0;
}

.playerBox:fullscreen .playerTop{
    z-index:20;
}

.playerBox:fullscreen #video{
    width:100vw;
    height:100vh;
}
</style>
</head>

<body>

<header class="header">

    <div class="brand">
        <div class="logoMark">NT</div>

        <div class="brandText">
            <strong>NIYATI TV</strong>
            <span>SPORTS IPTV</span>
        </div>
    </div>

    <div class="liveStatus">
        <span class="liveDot"></span>
        LIVE
    </div>

</header>


<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebarTitle">
            PACKAGES
        </div>

        <div id="packageList" class="packageList">
            <div class="loading">
                جاري التحميل...
            </div>
        </div>

    </aside>


    <!-- CONTENT -->
    <main class="content">

        <!-- PLAYER -->
        <section class="playerBox" id="playerBox">

            <video
                id="video"
                playsinline
                controls
                preload="metadata">
            </video>

            <div class="playerTop">

                <div class="nowPlaying" id="nowPlaying">
                    NIYATI TV
                </div>

                <button
                    class="fullscreenBtn"
                    id="fullscreenBtn">
                    ⛶
                </button>

            </div>

            <div class="playerOverlay" id="playerOverlay">

                <div class="playerMessage" id="playerMessage">
                    <strong>NIYATI TV</strong>
                    اختار قناة حتى يبدأ البث
                </div>

            </div>

        </section>


        <!-- SECTION HEADER -->
        <div class="sectionHead">

            <h2 id="packageTitle">
                القنوات
            </h2>

            <span id="channelCount">
                0 قناة
            </span>

        </div>


        <!-- CHANNELS -->
        <section class="channels">

            <div id="channelGrid" class="channelGrid">

                <div class="noChannels">
                    اختار باقة من القائمة
                </div>

            </div>

        </section>

    </main>

</div>


<!-- IMPORTANT:
     channels.js must be in the SAME folder as index.html
-->
<script src="./channels.js"></script>


<script>
"use strict";

/* =========================================================
   NIYATI TV CONTROLLER
   ========================================================= */

const video = document.getElementById("video");
const playerBox = document.getElementById("playerBox");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const packageList = document.getElementById("packageList");
const channelGrid = document.getElementById("channelGrid");
const packageTitle = document.getElementById("packageTitle");
const channelCount = document.getElementById("channelCount");
const nowPlaying = document.getElementById("nowPlaying");
const playerOverlay = document.getElementById("playerOverlay");
const playerMessage = document.getElementById("playerMessage");


/* =========================================================
   CHECK CHANNELS.JS
   ========================================================= */

const channelData =
    (typeof channels !== "undefined" && Array.isArray(channels))
        ? channels
        : [];

if (!channelData.length) {

    packageList.innerHTML = `
        <div style="
            padding:20px;
            color:#d66;
            font-size:12px;
            line-height:1.8;
        ">
            ⚠️ ما لكيت القنوات.<br>
            تأكد أن ملف <b>channels.js</b><br>
            موجود بنفس مجلد index.html
        </div>
    `;

    channelGrid.innerHTML = `
        <div class="noChannels">
            ملف channels.js لم يتم تحميله
        </div>
    `;

    console.error(
        "NIYATI TV: channels.js غير محمل أو channels ليست Array"
    );

} else {

    console.log(
        "NIYATI TV:",
        channelData.length,
        "channels loaded"
    );

}


/* =========================================================
   PLAYER STATE
   ========================================================= */

let hlsPlayer = null;
let dashPlayer = null;
let mpegPlayer = null;

let retryTimer = null;
let retryCount = 0;

const MAX_RETRIES = 5;
const RETRY_DELAY = 3000;

let currentChannel = null;
let currentQuality = 0;


/* =========================================================
   PACKAGES
   ========================================================= */

let packages = [];


function buildPackages(){

    const map = new Map();

    channelData.forEach(channel => {

        if (!channel) return;

        const packageName =
            channel.package ||
            "OTHER";

        if (!map.has(packageName)) {

            map.set(packageName,{
                name:packageName,
                logo:channel.logo || "",
                channels:[]
            });

        }

        map.get(packageName).channels.push(channel);

    });

    packages = Array.from(map.values());

    renderPackages();

    if(packages.length){

        selectPackage(packages[0].name);

    }

}


/* =========================================================
   RENDER PACKAGES
   ========================================================= */

function renderPackages(){

    packageList.innerHTML = "";

    packages.forEach(pkg => {

        const button =
            document.createElement("button");

        button.className = "packageBtn";

        button.type = "button";

        button.dataset.package = pkg.name;

        const logo = document.createElement("img");

        logo.className = "packageLogo";

        logo.alt = "";

        if(pkg.logo){

            logo.src = pkg.logo;

            logo.onerror = () => {

                logo.style.display = "none";

            };

        }else{

            logo.style.display = "none";

        }


        const name =
            document.createElement("span");

        name.className = "packageName";

        name.textContent = pkg.name;


        const count =
            document.createElement("span");

        count.className = "packageCount";

        count.textContent =
            pkg.channels.length;


        button.appendChild(logo);
        button.appendChild(name);
        button.appendChild(count);


        button.addEventListener(
            "click",
            () => selectPackage(pkg.name)
        );


        packageList.appendChild(button);

    });

}


/* =========================================================
   SELECT PACKAGE
   ========================================================= */

function selectPackage(packageName){

    const pkg =
        packages.find(
            p => p.name === packageName
        );

    if(!pkg) return;


    document
        .querySelectorAll(".packageBtn")
        .forEach(btn => {

            btn.classList.toggle(
                "active",
                btn.dataset.package === packageName
            );

        });


    packageTitle.textContent =
        pkg.name;


    channelCount.textContent =
        `${pkg.channels.length} قناة`;


    renderChannels(pkg.channels);

}


/* =========================================================
   RENDER CHANNELS
   ========================================================= */

function renderChannels(list){

    channelGrid.innerHTML = "";


    if(!list.length){

        channelGrid.innerHTML = `
            <div class="noChannels">
                لا توجد قنوات بهذه الباقة
            </div>
        `;

        return;

    }


    list.forEach((channel,index) => {

        const card =
            document.createElement("article");

        card.className = "channelCard";

        card.tabIndex = 0;

        card.dataset.channelId =
            channel.id || index;


        /* ================= LOGO ================= */

        const logoBox =
            document.createElement("div");

        logoBox.className =
            "channelLogoBox";


        if(channel.logo){

            const img =
                document.createElement("img");

            img.className =
                "channelLogo";

            img.alt =
                channel.name || "Channel";

            img.src =
                channel.logo;


            img.onerror = () => {

                img.remove();

                const fallback =
                    createFallbackLogo();

                logoBox.appendChild(fallback);

            };


            logoBox.appendChild(img);

        }else{

            logoBox.appendChild(
                createFallbackLogo()
            );

        }


        /* ================= NAME ================= */

        const name =
            document.createElement("div");

        name.className =
            "channelName";

        name.textContent =
            channel.name ||
            "Unknown Channel";


        /* ================= QUALITY ================= */

        const qualityList =
            document.createElement("div");

        qualityList.className =
            "qualityList";


        const qualities =
            Array.isArray(channel.qualities)
                ? channel.qualities
                : [];


        qualities.forEach((quality,qIndex) => {

            if(!quality || !quality.url)
                return;


            const qualityBtn =
                document.createElement("button");

            qualityBtn.type = "button";

            qualityBtn.className =
                "qualityBtn";


            if(qIndex === 0){

                qualityBtn.classList.add(
                    "active"
                );

            }


            qualityBtn.textContent =
                quality.name ||
                `Q${qIndex + 1}`;


            qualityBtn.addEventListener(
                "click",
                event => {

                    event.stopPropagation();

                    playChannelFromUI(
                        channel,
                        qIndex
                    );

                    card
                        .querySelectorAll(".qualityBtn")
                        .forEach(
                            b => b.classList.remove("active")
                        );

                    qualityBtn.classList.add("active");

                }
            );


            qualityList.appendChild(
                qualityBtn
            );

        });


        card.appendChild(logoBox);
        card.appendChild(name);
        card.appendChild(qualityList);


        /* ================= CARD CLICK ================= */

        card.addEventListener(
            "click",
            () => {

                playChannelFromUI(
                    channel,
                    0
                );

                document
                    .querySelectorAll(".channelCard")
                    .forEach(
                        c => c.classList.remove("active")
                    );

                card.classList.add("active");

            }
        );


        /* ================= KEYBOARD / TV ================= */

        card.addEventListener(
            "keydown",
            event => {

                if(
                    event.key === "Enter" ||
                    event.key === " "
                ){

                    event.preventDefault();

                    playChannelFromUI(
                        channel,
                        0
                    );

                    card.classList.add("active");

                }

            }
        );


        channelGrid.appendChild(card);

    });

}


/* =========================================================
   FALLBACK LOGO
   ========================================================= */

function createFallbackLogo(){

    const fallback =
        document.createElement("div");

    fallback.className =
        "channelFallback";

    fallback.textContent =
        "NT";

    return fallback;

}


/* =========================================================
   PLAY CHANNEL
   ========================================================= */

function playChannelFromUI(
    channel,
    qualityIndex = 0
){

    if(!channel)
        return;


    if(
        !Array.isArray(channel.qualities) ||
        !channel.qualities.length
    ){

        showPlayerMessage(
            "خطأ",
            "هذه القناة ما بيها رابط بث"
        );

        return;

    }


    const quality =
        channel.qualities[qualityIndex] ||
        channel.qualities[0];


    if(!quality || !quality.url){

        showPlayerMessage(
            "خطأ",
            "رابط البث غير موجود"
        );

        return;

    }


    currentChannel = channel;
    currentQuality = qualityIndex;


    nowPlaying.textContent =
        `${channel.name || "Channel"} • ${quality.name || ""}`;


    showPlayerMessage(
        "جاري التشغيل",
        channel.name || "Channel"
    );


    loadStream(
        quality.url,
        channel
    );

}


/* =========================================================
   LOAD STREAM
   ========================================================= */

async function loadStream(
    url,
    channel
){

    stopPlayers();

    clearTimeout(retryTimer);

    retryCount = 0;


    const cleanUrl =
        String(url || "").trim();


    if(!cleanUrl){

        showPlayerMessage(
            "خطأ",
            "الرابط فارغ"
        );

        return;

    }


    console.log(
        "NIYATI PLAY:",
        cleanUrl
    );


    const lower =
        cleanUrl.toLowerCase();


    /* ================= RTSP ================= */

    if(
        lower.startsWith("rtsp://")
    ){

        showPlayerMessage(
            "غير مدعوم بالمتصفح",
            "RTSP يحتاج سيرفر تحويل إلى HLS"
        );

        return;

    }


    /* ================= RTMP ================= */

    if(
        lower.startsWith("rtmp://")
    ){

        showPlayerMessage(
            "غير مدعوم بالمتصفح",
            "RTMP يحتاج تحويل إلى HLS"
        );

        return;

    }


    /* ================= HEADERS ================= */

    const headers = {};


    if(channel){

        if(channel.userAgent){

            headers[
                "User-Agent"
            ] = channel.userAgent;

        }

        if(channel.referer){

            headers[
                "Referer"
            ] = channel.referer;

        }

    }


    /* ================= HLS ================= */

    if(
        lower.includes(".m3u8") ||
        lower.includes("m3u8?")
    ){

        await playHLS(
            cleanUrl,
            headers
        );

        return;

    }


    /* ================= DASH ================= */

    if(
        lower.includes(".mpd") ||
        lower.includes("mpd?")
    ){

        await playDASH(
            cleanUrl,
            headers
        );

        return;

    }


    /* ================= MPEG TS ================= */

    if(
        lower.includes(".ts") ||
        lower.includes("output=ts") ||
        lower.includes("type=ts")
    ){

        await playMPEGTS(
            cleanUrl,
            headers
        );

        return;

    }


    /* ================= MP4 / WEBM ================= */

    playNative(
        cleanUrl
    );

}


/* =========================================================
   HLS
   ========================================================= */

function playHLS(
    url,
    headers
){

    if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src = url;

        video.play()
            .then(() => {

                hidePlayerMessage();

            })
            .catch(error => {

                handlePlaybackError(
                    error
                );

            });

        return;

    }


    if(
        typeof Hls !== "undefined" &&
        Hls.isSupported()
    ){

        hlsPlayer =
            new Hls({

                enableWorker:true,

                lowLatencyMode:true,

                maxBufferLength:30,

                xhrSetup:function(
                    xhr
                ){

                    Object.keys(headers)
                        .forEach(key => {

                            try{

                                xhr.setRequestHeader(
                                    key,
                                    headers[key]
                                );

                            }catch(e){}

                        });

                }

            });


        hlsPlayer.loadSource(url);

        hlsPlayer.attachMedia(video);


        hlsPlayer.on(
            Hls.Events.MANIFEST_PARSED,
            () => {

                video.play()
                    .then(() => {

                        hidePlayerMessage();

                    })
                    .catch(
                        handlePlaybackError
                    );

            }
        );


        hlsPlayer.on(
            Hls.Events.ERROR,
            (event,data) => {

                console.error(
                    "HLS ERROR:",
                    data
                );


                if(data.fatal){

                    handlePlaybackError(
                        data
                    );

                }

            }
        );


        return;

    }


    showPlayerMessage(
        "غير مدعوم",
        "المتصفح لا يدعم HLS"
    );

}


/* =========================================================
   DASH
   ========================================================= */

function playDASH(
    url,
    headers
){

    if(
        typeof dashjs === "undefined"
    ){

        showPlayerMessage(
            "خطأ",
            "مكتبة DASH لم يتم تحميلها"
        );

        return;

    }


    try{

        dashPlayer =
            dashjs.MediaPlayer().create();


        dashPlayer.updateSettings({

            streaming:{
                requestModifier:{
                    modifyRequestHeader:function(
                        xhr
                    ){

                        Object.keys(headers)
                            .forEach(key => {

                                try{

                                    xhr.setRequestHeader(
                                        key,
                                        headers[key]
                                    );

                                }catch(e){}

                            });

                        return xhr;

                    }
                }
            }

        });


        dashPlayer.initialize(
            video,
            url,
            true
        );


        dashPlayer.on(
            dashjs.MediaPlayer.events.STREAM_INITIALIZED,
            () => {

                hidePlayerMessage();

            }
        );


        dashPlayer.on(
            dashjs.MediaPlayer.events.ERROR,
            error => {

                console.error(
                    "DASH ERROR:",
                    error
                );

                handlePlaybackError(
                    error
                );

            }
        );


    }catch(error){

        handlePlaybackError(
            error
        );

    }

}


/* =========================================================
   MPEG TS
   ========================================================= */

function playMPEGTS(
    url,
    headers
){

    if(
        typeof mpegts === "undefined"
    ){

        showPlayerMessage(
            "خطأ",
            "مكتبة MPEG-TS لم يتم تحميلها"
        );

        return;

    }


    if(
        !mpegts.isSupported()
    ){

        showPlayerMessage(
            "غير مدعوم",
            "المتصفح لا يدعم MPEG-TS"
        );

        return;

    }


    try{

        mpegPlayer =
            mpegts.createPlayer({

                type:"mpegts",

                isLive:true,

                url:url

            });


        mpegPlayer.attachMediaElement(
            video
        );


        mpegPlayer.load();


        mpegPlayer.play()
            .then(() => {

                hidePlayerMessage();

            })
            .catch(
                handlePlaybackError
            );


        mpegPlayer.on(
            mpegts.Events.ERROR,
            (type,details,error) => {

                console.error(
                    "MPEGTS ERROR:",
                    type,
                    details,
                    error
                );

                handlePlaybackError(
                    error || details
                );

            }
        );


    }catch(error){

        handlePlaybackError(
            error
        );

    }

}


/* =========================================================
   NATIVE
   ========================================================= */

function playNative(url){

    video.src = url;

    video.load();


    video.play()
        .then(() => {

            hidePlayerMessage();

        })
        .catch(
            handlePlaybackError
        );

}


/* =========================================================
   ERROR
   ========================================================= */

function handlePlaybackError(error){

    console.error(
        "NIYATI PLAYBACK ERROR:",
        error
    );


    if(retryCount < MAX_RETRIES){

        retryCount++;


        showPlayerMessage(
            "إعادة الاتصال",
            `المحاولة ${retryCount} من ${MAX_RETRIES}`
        );


        clearTimeout(
            retryTimer
        );


        retryTimer =
            setTimeout(() => {

                if(currentChannel){

                    const quality =
                        currentChannel.qualities[
                            currentQuality
                        ] ||
                        currentChannel.qualities[0];


                    if(quality){

                        loadStream(
                            quality.url,
                            currentChannel
                        );

                    }

                }

            }, RETRY_DELAY);


        return;

    }


    let reason =
        "تعذر تشغيل البث";


    if(
        location.protocol === "https:" &&
        /^http:\/\//i.test(
            getCurrentUrl()
        )
    ){

        reason =
            "الرابط HTTP والمتصفح يمنعه من صفحة HTTPS (Mixed Content)";

    }


    showPlayerMessage(
        "فشل التشغيل",
        reason
    );

}


/* =========================================================
   CURRENT URL
   ========================================================= */

function getCurrentUrl(){

    if(
        currentChannel &&
        currentChannel.qualities
    ){

        const q =
            currentChannel.qualities[
                currentQuality
            ] ||
            currentChannel.qualities[0];

        return q?.url || "";

    }

    return "";

}


/* =========================================================
   STOP PLAYERS
   ========================================================= */

function stopPlayers(){

    try{

        if(hlsPlayer){

            hlsPlayer.destroy();
            hlsPlayer = null;

        }

    }catch(e){}


    try{

        if(dashPlayer){

            dashPlayer.reset();
            dashPlayer = null;

        }

    }catch(e){}


    try{

        if(mpegPlayer){

            mpegPlayer.pause();
            mpegPlayer.unload();
            mpegPlayer.detachMediaElement();
            mpegPlayer.destroy();

            mpegPlayer = null;

        }

    }catch(e){}


    try{

        video.pause();

    }catch(e){}


    video.removeAttribute("src");

    try{

        video.load();

    }catch(e){}

}


/* =========================================================
   PLAYER MESSAGE
   ========================================================= */

function showPlayerMessage(
    title,
    message
){

    playerOverlay.style.display =
        "flex";


    playerMessage.innerHTML = `
        <strong>${escapeHtml(title)}</strong>
        ${escapeHtml(message)}
    `;

}


function hidePlayerMessage(){

    playerOverlay.style.display =
        "none";

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   FULLSCREEN
   ========================================================= */

fullscreenBtn.addEventListener(
    "click",
    async () => {

        try{

            if(
                !document.fullscreenElement
            ){

                await playerBox.requestFullscreen();

            }else{

                await document.exitFullscreen();

            }

        }catch(error){

            console.error(
                "Fullscreen error:",
                error
            );

        }

    }
);


/* =========================================================
   VIDEO EVENTS
   ========================================================= */

video.addEventListener(
    "playing",
    () => {

        hidePlayerMessage();

    }
);


video.addEventListener(
    "waiting",
    () => {

        if(currentChannel){

            showPlayerMessage(
                "جاري التحميل",
                currentChannel.name || ""
            );

        }

    }
);


video.addEventListener(
    "error",
    () => {

        console.error(
            "VIDEO ERROR:",
            video.error
        );

        handlePlaybackError(
            video.error
        );

    }
);

   START
   ========================================================= */

buildPackages();

</script>
