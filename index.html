<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Niyati TV</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background:
        radial-gradient(circle at 85% 0%, #20283a 0%, transparent 35%),
        radial-gradient(circle at 10% 100%, #161c2b 0%, transparent 35%),
        #070a10;

    color: #fff;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}


/* =====================================================
   HEADER
===================================================== */

header {
    height: 82px;

    display: flex;
    align-items: center;

    padding: 0 34px;

    background: rgba(9,13,21,.92);

    border-bottom: 1px solid rgba(255,255,255,.07);

    backdrop-filter: blur(18px);

    position: sticky;
    top: 0;

    z-index: 100;
}

.logo {
    width: 52px;
    height: 52px;

    border-radius: 16px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            145deg,
            #ff315b,
            #b90035
        );

    font-size: 20px;
    font-weight: 900;

    box-shadow:
        0 8px 30px rgba(230,15,65,.35);
}

.title {
    margin-right: 15px;
}

.title h1 {
    font-size: 22px;
    font-weight: 800;
}

.title span {
    display: block;

    color: #747d8e;

    font-size: 11px;

    margin-top: 4px;
}


/* =====================================================
   MAIN
===================================================== */

main {
    display: flex;

    gap: 24px;

    padding: 25px;

    min-height:
        calc(100vh - 82px);
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {
    width: 245px;

    flex-shrink: 0;

    padding: 20px 15px;

    background:
        linear-gradient(
            180deg,
            rgba(19,25,37,.97),
            rgba(11,15,23,.97)
        );

    border:
        1px solid rgba(255,255,255,.07);

    border-radius: 23px;

    height:
        calc(100vh - 132px);

    overflow-y: auto;

    scrollbar-width: thin;

    box-shadow:
        0 20px 60px rgba(0,0,0,.25);
}

.sidebar-title {
    display: flex;

    align-items: center;

    gap: 10px;

    padding:
        0 8px 17px;

    color: #d9dee8;

    font-size: 17px;

    font-weight: 800;
}

.sidebar-title::before {
    content: "";

    width: 4px;

    height: 20px;

    border-radius: 5px;

    background:
        linear-gradient(
            #ff315b,
            #bd0038
        );
}


/* =====================================================
   PACKAGE
===================================================== */

.package {
    width: 100%;

    min-height: 53px;

    margin-bottom: 8px;

    padding: 0 15px;

    border:
        1px solid transparent;

    border-radius: 14px;

    background:
        rgba(255,255,255,.035);

    color: #aeb6c5;

    text-align: right;

    font-size: 13px;

    font-weight: 700;

    cursor: pointer;

    transition:
        .18s ease;

    display: flex;

    align-items: center;
}

.package:hover {
    background:
        rgba(255,255,255,.08);

    color: white;
}

.package:focus {
    outline: none;

    border-color:
        #ff315b;

    box-shadow:
        0 0 0 3px
        rgba(255,49,91,.15);
}

.package.active {
    color: white;

    background:
        linear-gradient(
            135deg,
            #ed1648,
            #a80032
        );

    border-color:
        rgba(255,255,255,.12);

    box-shadow:
        0 9px 25px
        rgba(225,18,67,.28);
}


/* =====================================================
   CONTENT
===================================================== */

.content {
    flex: 1;

    min-width: 0;

    padding-top: 4px;
}

.content-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 20px;

    padding:
        0 3px;
}

.content-title {
    display: flex;

    align-items: center;

    gap: 12px;
}

.content-title h2 {
    font-size: 25px;

    font-weight: 850;
}

.live-dot {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #ff315b;

    box-shadow:
        0 0 15px
        rgba(255,49,91,.8);
}

.channel-count {
    padding:
        8px 13px;

    border:
        1px solid rgba(255,255,255,.07);

    border-radius: 10px;

    background:
        rgba(255,255,255,.035);

    color: #858e9f;

    font-size: 12px;
}


/* =====================================================
   CHANNEL GRID
===================================================== */

.channels {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(215px, 1fr)
        );

    gap: 16px;
}


/* =====================================================
   CHANNEL CARD
===================================================== */

.channel {
    position: relative;

    min-height: 178px;

    padding: 17px;

    border:
        1px solid rgba(255,255,255,.065);

    border-radius: 19px;

    background:
        linear-gradient(
            145deg,
            rgba(23,30,44,.98),
            rgba(12,17,26,.98)
        );

    cursor: pointer;

    display: flex;

    flex-direction: column;

    justify-content: space-between;

    transition:
        transform .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
}

.channel::after {
    content: "";

    position: absolute;

    left: 0;
    right: 0;

    bottom: 0;

    height: 2px;

    opacity: 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            #ff315b,
            transparent
        );

    transition:
        .18s ease;
}

.channel:hover {
    transform:
        translateY(-4px);

    border-color:
        rgba(255,49,91,.55);

    box-shadow:
        0 18px 40px
        rgba(0,0,0,.35);
}

.channel:hover::after {
    opacity: 1;
}

.channel:focus {
    outline: none;

    transform:
        translateY(-3px);

    border-color:
        #ff315b;

    box-shadow:
        0 0 0 3px
        rgba(255,49,91,.18),
        0 18px 40px
        rgba(0,0,0,.4);
}

.channel-top {
    display: flex;

    align-items: center;

    gap: 13px;
}


/* =====================================================
   LOGO
===================================================== */

.channel-logo {
    width: 62px;
    height: 62px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    border-radius: 16px;

    background:
        linear-gradient(
            145deg,
            #252e40,
            #151b28
        );

    border:
        1px solid rgba(255,255,255,.07);

    color: #fff;

    font-size: 18px;

    font-weight: 900;
}

.channel-logo img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    padding: 6px;
}


/* =====================================================
   CHANNEL NAME
===================================================== */

.channel-name {
    color: #f1f3f7;

    font-size: 15px;

    font-weight: 800;

    line-height: 1.45;
}


/* =====================================================
   QUALITY
===================================================== */

.quality-title {
    color: #737d8f;

    font-size: 10px;

    margin-top: 15px;

    margin-bottom: 8px;
}

.qualities {
    display: flex;

    flex-wrap: wrap;

    gap: 6px;
}

.quality {
    border:
        1px solid rgba(255,255,255,.08);

    background:
        rgba(255,255,255,.045);

    color: #c5ccd8;

    border-radius: 8px;

    padding:
        6px 10px;

    font-size: 10px;

    font-weight: 800;

    cursor: pointer;

    transition:
        .15s ease;
}

.quality:hover,
.quality:focus {
    background:
        #ed1648;

    border-color:
        #ed1648;

    color: white;

    outline: none;
}

.quality:focus {
    box-shadow:
        0 0 0 3px
        rgba(255,49,91,.2);
}

.single-quality {
    color: #6f7889;

    font-size: 10px;

    margin-top: 15px;
}


/* =====================================================
   EMPTY
===================================================== */

.empty {
    grid-column:
        1 / -1;

    padding: 60px 20px;

    text-align: center;

    border:
        1px solid rgba(255,255,255,.06);

    border-radius: 18px;

    background:
        rgba(255,255,255,.025);

    color: #737d8e;
}


/* =====================================================
   PLAYER
===================================================== */

.player {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 9999;

    align-items: center;
    justify-content: center;

    background: #000;
}

.player video {
    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;
}


/* =====================================================
   PLAYER CLOSE
===================================================== */

.close {
    position: absolute;

    top: 22px;
    right: 22px;

    z-index: 10000;

    padding:
        11px 18px;

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius: 11px;

    background:
        rgba(0,0,0,.7);

    color: white;

    font-size: 13px;

    cursor: pointer;

    backdrop-filter:
        blur(12px);

    transition:
        .15s ease;
}

.close:hover,
.close:focus {
    background:
        #ed1648;

    border-color:
        #ed1648;

    outline: none;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 850px) {

    main {
        flex-direction: column;

        padding: 15px;
    }

    .sidebar {
        width: 100%;

        height: auto;

        max-height: 230px;
    }

    .channels {
        grid-template-columns:
            repeat(2, 1fr);
    }
}

@media (max-width: 500px) {

    header {
        height: 70px;

        padding: 0 16px;
    }

    .logo {
        width: 44px;
        height: 44px;

        border-radius: 13px;
    }

    .title h1 {
        font-size: 19px;
    }

    .channels {
        grid-template-columns:
            repeat(2, 1fr);

        gap: 10px;
    }

    .channel {
        min-height: 155px;

        padding: 12px;
    }

    .channel-logo {
        width: 50px;
        height: 50px;
    }

    .channel-name {
        font-size: 13px;
    }
}


/* =====================================================
   TV LARGE SCREEN
===================================================== */

@media (min-width: 1200px) {

    .channels {
        grid-template-columns:
            repeat(
                auto-fill,
                minmax(230px, 1fr)
            );
    }

    .channel {
        min-height: 185px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="logo">
        NT
    </div>

    <div class="title">

        <h1>Niyati TV</h1>

        <span>IPTV PLATFORM</span>

    </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main>


    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside class="sidebar">

        <div class="sidebar-title">
            الباقات
        </div>


        <button
            class="package active"
            data-package="bein"
            tabindex="0">

            ⚽ beIN SPORTS

        </button>


        <button
            class="package"
            data-package="alwan"
            tabindex="0">

            🏆 ALWAN SPORT

        </button>


        <button
            class="package"
            data-package="shahid"
            tabindex="0">

            ⭐ SHAHID SPORTS

        </button>


        <button
            class="package"
            data-package="shasha"
            tabindex="0">

            🎯 SHASHA

        </button>


        <button
            class="package"
            data-package="dazn"
            tabindex="0">

            🏎️ DAZN

        </button>


        <button
            class="package"
            data-package="thamanya"
            tabindex="0">

            📺 THAMANYA

        </button>


        <button
            class="package"
            data-package="alkass"
            tabindex="0">

            🏆 ALKASS SPORT

        </button>


        <button
            class="package"
            data-package="ad"
            tabindex="0">

            🇦🇪 AD SPORT

        </button>


        <button
            class="package"
            data-package="dubai"
            tabindex="0">

            📡 DUBAI SPORT

        </button>


        <button
            class="package"
            data-package="iraqia"
            tabindex="0">

            🇮🇶 IRAQIA SPORT

        </button>

    </aside>


    <!-- =================================================
         CONTENT
    ================================================== -->

    <section class="content">

        <div class="content-header">

            <div class="content-title">

                <span class="live-dot"></span>

                <h2 id="packageTitle">
                    beIN SPORTS
                </h2>

            </div>


            <div
                class="channel-count"
                id="channelCount">

                0 قناة

            </div>

        </div>


        <div
            class="channels"
            id="channels">
        </div>

    </section>

</main>


<!-- =====================================================
     PLAYER
===================================================== -->

<div
    class="player"
    id="player">

    <button
        class="close"
        id="closePlayer">

        رجوع

    </button>


    <video
        id="video"
        controls
        playsinline>
    </video>

</div>


<!-- =====================================================
     CHANNEL DATA
===================================================== -->

<script src="channels.js"></script>


<!-- =====================================================
     PLAYER
===================================================== -->

<script src="player.js"></script>


<script>


/* =====================================================
   PACKAGE NAMES
===================================================== */

const packageNames = {

    bein: "beIN SPORTS",

    alwan: "ALWAN SPORT",

    shahid: "SHAHID SPORTS",

    shasha: "SHASHA",

    dazn: "DAZN",

    thamanya: "THAMANYA",

    alkass: "ALKASS SPORT",

    ad: "AD SPORT",

    dubai: "DUBAI SPORT",

    iraqia: "IRAQIA SPORT"

};


/* =====================================================
   PACKAGE KEYS
===================================================== */

const packageKeys = {

    bein: "beIN SPORTS",

    alwan: "ALWAN SPORT",

    shahid: "SHAHID SPORTS",

    shasha: "SHASHA",

    dazn: "DAZN",

    thamanya: "THAMANYA",

    alkass: "ALKASS SPORT",

    ad: "AD SPORT",

    dubai: "DUBAI SPORT",

    iraqia: "IRAQIA SPORT"

};


/* =====================================================
   GET CHANNELS
===================================================== */

function getChannels() {

    if (
        typeof channels !== "undefined" &&
        Array.isArray(channels)
    ) {

        return channels;

    }

    console.error(
        "channels.js not found"
    );

    return [];

}


/* =====================================================
   SHOW PACKAGE
===================================================== */

function showPackage(packageId) {

    const allChannels =
        getChannels();

    const realPackage =
        packageKeys[packageId];

    const filteredChannels =
        allChannels.filter(
            function(channel) {

                return (
                    channel.package ===
                    realPackage
                );

            }
        );


    const container =
        document.getElementById(
            "channels"
        );


    const title =
        document.getElementById(
            "packageTitle"
        );


    const count =
        document.getElementById(
            "channelCount"
        );


    title.textContent =
        packageNames[packageId];


    count.textContent =
        filteredChannels.length +
        " قناة";


    container.innerHTML = "";


    /* =================================================
       EMPTY
    ================================================= */

    if (
        filteredChannels.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                لا توجد قنوات في هذه الباقة

            </div>

        `;

        return;

    }


    /* =================================================
       CHANNELS
    ================================================= */

    filteredChannels.forEach(

        function(channel, index) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "channel";


            item.tabIndex =
                0;


            /* =========================================
               LOGO
            ========================================= */

            let logoHTML = "";


            if (
                channel.logo
            ) {

                logoHTML = `

                    <img
                        src="${channel.logo}"
                        alt=""
                        loading="lazy"
                        onerror="
                            this.style.display='none';
                            this.parentElement.textContent='${index + 1}';
                        "
                    >

                `;

            }

            else {

                logoHTML =
                    `${index + 1}`;

            }


            /* =========================================
               QUALITY
            ========================================= */

            let qualityHTML = "";


            if (
                Array.isArray(
                    channel.qualities
                ) &&
                channel.qualities.length > 0
            ) {

                if (
                    channel.qualities.length === 1
                ) {

                    qualityHTML = `

                        <div class="single-quality">

                            ${channel.qualities[0].name}

                        </div>

                    `;

                }

                else {

                    qualityHTML = `

                        <div class="quality-title">

                            اختر الجودة

                        </div>

                        <div class="qualities">

                    `;


                    channel.qualities.forEach(

                        function(
                            quality,
                            qualityIndex
                        ) {

                            qualityHTML += `

                                <button
                                    class="quality"
                                    tabindex="0"
                                    data-quality-index="${qualityIndex}">

                                    ${quality.name}

                                </button>

                            `;

                        }

                    );


                    qualityHTML += `

                        </div>

                    `;

                }

            }


            /* =========================================
               CARD
            ========================================= */

            item.innerHTML = `

                <div class="channel-top">

                    <div class="channel-logo">

                        ${logoHTML}

                    </div>

                    <div class="channel-name">

                        ${channel.name}

                    </div>

                </div>

                ${qualityHTML}

            `;


            /* =========================================
               QUALITY BUTTONS
            ========================================= */

            const qualityButtons =
                item.querySelectorAll(
                    ".quality"
                );


            qualityButtons.forEach(

                function(button) {

                    button.addEventListener(

                        "click",

                        function(event) {

                            event.stopPropagation();


                            const qualityIndex =
                                Number(
                                    this.dataset
                                        .qualityIndex
                                );


                            const selectedQuality =
                                channel.qualities[
                                    qualityIndex
                                ];


                            if (
                                selectedQuality &&
                                selectedQuality.url
                            ) {

                                openChannel(
                                    selectedQuality.url
                                );

                            }

                        }

                    );


                    button.addEventListener(

                        "keydown",

                        function(event) {

                            if (
                                event.key ===
                                    "Enter" ||

                                event.key ===
                                    " "
                            ) {

                                event.preventDefault();

                                event.stopPropagation();


                                const qualityIndex =
                                    Number(
                                        this.dataset
                                            .qualityIndex
                                    );


                                const selectedQuality =
                                    channel.qualities[
                                        qualityIndex
                                    ];


                                if (
                                    selectedQuality &&
                                    selectedQuality.url
                                ) {

                                    openChannel(
                                        selectedQuality.url
                                    );

                                }

                            }

                        }

                    );

                }

            );


            /* =========================================
               CARD CLICK
            ========================================= */

            item.addEventListener(

                "click",

                function(event) {

                    if (
                        event.target.closest(
                            ".quality"
                        )
                    ) {

                        return;

                    }


                    if (
                        Array.isArray(
                            channel.qualities
                        ) &&
                        channel.qualities.length === 1
                    ) {

                        openChannel(
                            channel.qualities[0].url
                        );

                    }

                }

            );


            /* =========================================
               CARD REMOTE
            ========================================= */

            item.addEventListener(

                "keydown",

                function(event) {

                    if (
                        event.key === "Enter" ||
                        event.key === " "
                    ) {

                        if (
                            event.target
                                .classList
                                .contains(
                                    "quality"
                                )
                        ) {

                            return;

                        }


                        event.preventDefault();


                        if (
                            Array.isArray(
                                channel.qualities
                            ) &&
                            channel.qualities.length === 1
                        ) {

                            openChannel(
                                channel.qualities[0].url
                            );

                        }

                    }

                }

            );


            container.appendChild(
                item
            );

        }

    );

}


/* =====================================================
   OPEN CHANNEL
===================================================== */

function openChannel(url) {

    if (!url) {

        alert(
            "رابط القناة غير موجود"
        );

        return;

    }


    const playerBox =
        document.getElementById(
            "player"
        );


    playerBox.style.display =
        "flex";


    if (
        typeof playChannel ===
        "function"
    ) {

        playChannel(
            url
        );

    }

    else {

        const video =
            document.getElementById(
                "video"
            );


        video.src =
            url;


        video.load();


        video.play().catch(
            function(error) {

                console.log(
                    error
                );

            }
        );

    }

}


/* =====================================================
   CLOSE PLAYER
===================================================== */

function closePlayer() {

    const playerBox =
        document.getElementById(
            "player"
        );


    if (
        typeof stopChannel ===
        "function"
    ) {

        stopChannel();

    }

    else {

        const video =
            document.getElementById(
                "video"
            );


        video.pause();

        video.removeAttribute(
            "src"
        );

        video.load();

    }


    playerBox.style.display =
        "none";

}


/* =====================================================
   CLOSE BUTTON
===================================================== */

document
    .getElementById(
        "closePlayer"
    )
    .addEventListener(

        "click",

        function() {

            closePlayer();

        }

    );


/* =====================================================
   PACKAGE BUTTONS
===================================================== */

document
    .querySelectorAll(
        ".package"
    )
    .forEach(

        function(button) {

            button.addEventListener(

                "click",

                function() {

                    document
                        .querySelectorAll(
                            ".package"
                        )
                        .forEach(

                            function(btn) {

                                btn.classList
                                    .remove(
                                        "active"
                                    );

                            }

                        );


                    this.classList.add(
                        "active"
                    );


                    showPackage(
                        this.dataset.package
                    );

                }

            );

        }

    );


/* =====================================================
   TV REMOTE BACK
===================================================== */

document.addEventListener(

    "keydown",

    function(event) {

        const playerBox =
            document.getElementById(
                "player"
            );


        if (
            event.key === "Escape" ||
            event.key === "Backspace"
        ) {

            if (
                playerBox.style.display ===
                "flex"
            ) {

                closePlayer();

                event.preventDefault();

                return;

            }

        }

    }

);


/* =====================================================
   START
===================================================== */

document.addEventListener(

    "DOMContentLoaded",

    function() {

        showPackage(
            "bein"
        );

    }

);

</script>

</body>
</html>
