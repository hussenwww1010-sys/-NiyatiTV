<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Niyati TV</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:#080b12;
    color:#fff;
    font-family:Arial,sans-serif;
    min-height:100vh;
}

header{
    height:75px;
    display:flex;
    align-items:center;
    padding:0 25px;
    background:#10151f;
    border-bottom:1px solid #202735;
}

.logo{
    width:48px;
    height:48px;
    border-radius:14px;
    background:linear-gradient(135deg,#e91542,#ff5c7a);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
}

.title{
    margin-right:14px;
}

.title h1{
    font-size:22px;
}

.title span{
    color:#9299a8;
    font-size:12px;
}

main{
    display:flex;
    gap:22px;
    padding:22px;
}

.sidebar{
    width:230px;
    background:#10151f;
    border-radius:18px;
    padding:18px;
    flex-shrink:0;
}

.sidebar h2{
    color:#b8bfcd;
    font-size:17px;
    margin-bottom:15px;
}

.package{
    width:100%;
    border:0;
    border-radius:12px;
    padding:14px;
    margin-bottom:9px;
    background:#171d28;
    color:white;
    text-align:right;
    cursor:pointer;
    font-size:15px;
}

.package.active,
.package:focus{
    background:#e91542;
    outline:none;
}

.content{
    flex:1;
}

.content h2{
    margin-bottom:18px;
}

.channels{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(190px,1fr));
    gap:15px;
}

.channel{
    background:#111722;
    border:1px solid #202735;
    border-radius:16px;
    padding:18px;
    min-height:110px;
    cursor:pointer;
    transition:.2s;
}

.channel:hover,
.channel:focus{
    border-color:#e91542;
    transform:translateY(-2px);
    outline:none;
}

.channel-logo{
    width:46px;
    height:46px;
    border-radius:12px;
    background:#202735;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:12px;
    font-weight:bold;
}

.channel-name{
    font-size:14px;
    font-weight:bold;
}

/* PLAYER */

.player{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    background:#000;
    align-items:center;
    justify-content:center;
}

.player video{
    width:100%;
    height:100%;
    object-fit:contain;
}

.close{
    position:absolute;
    top:20px;
    right:20px;
    z-index:10000;
    background:rgba(0,0,0,.75);
    color:white;
    border:0;
    border-radius:10px;
    padding:12px 18px;
    font-size:15px;
    cursor:pointer;
}

@media(max-width:700px){

    main{
        flex-direction:column;
        padding:12px;
    }

    .sidebar{
        width:100%;
    }

    .channels{
        grid-template-columns:repeat(2,1fr);
    }
}

</style>
</head>

<body>

<header>

    <div class="logo">
        NT
    </div>

    <div class="title">
        <h1>Niyati TV</h1>
        <span>IPTV Platform</span>
    </div>

</header>


<main>

    <aside class="sidebar">

        <h2>الباقات</h2>

        <button
            class="package active"
            data-package="bein"
            tabindex="0">
            ⚽ beIN SPORTS
        </button>

        <button
            class="package"
            data-package="alwan"
            tabindex="0">
            🏆 ALWAN SPORT
        </button>

        <button
            class="package"
            data-package="thamanya"
            tabindex="0">
            📺 THAMANYA
        </button>

        <button
            class="package"
            data-package="alkass"
            tabindex="0">
            🏆 ALKASS SPORT
        </button>

        <button
            class="package"
            data-package="ad"
            tabindex="0">
            🇦🇪 AD SPORT
        </button>

        <button
            class="package"
            data-package="dubai"
            tabindex="0">
            📡 DUBAI SPORT
        </button>

        <button
            class="package"
            data-package="iraqia"
            tabindex="0">
            🇮🇶 IRAQIA SPORT
        </button>

    </aside>


    <section class="content">

        <h2 id="packageTitle">
            beIN SPORTS
        </h2>

        <div
            class="channels"
            id="channels">
        </div>

    </section>

</main>


<!-- PLAYER -->

<div
    class="player"
    id="player">

    <button
        class="close"
        id="closePlayer">
        رجوع
    </button>

    <video
        id="video"
        controls
        playsinline>
    </video>

</div>


<!-- CHANNEL DATA -->

<script src="channels.js"></script>

<!-- PLAYER -->

<script src="player.js"></script>


<script>

/* =====================================
   Niyati TV
   ===================================== */

let currentPackage = "bein";

const packageNames = {

    bein: "beIN SPORTS",

    alwan: "ALWAN SPORT",

    thamanya: "THAMANYA",

    alkass: "ALKASS SPORT",

    ad: "AD SPORT",

    dubai: "DUBAI SPORT",

    iraqia: "IRAQIA SPORT"

};


/* =====================================
   FIND CHANNEL DATA
   ===================================== */

function getChannels(){

    /*
       channels.js يجب أن يحتوي
       على متغير channels

       مثال:

       const channels = [
          {
             name:"...",
             url:"...",
             package:"bein"
          }
       ];
    */

    if(
        typeof channels !== "undefined" &&
        Array.isArray(channels)
    ){

        return channels;

    }

    console.error(
        "channels.js لم يتم تحميله أو متغير channels غير موجود"
    );

    return [];

}


/* =====================================
   SHOW PACKAGE
   ===================================== */

function showPackage(packageId){

    currentPackage = packageId;

    const allChannels = getChannels();

    const filtered =
        allChannels.filter(
            channel =>
                channel.package === packageId
        );

    const container =
        document.getElementById("channels");

    const title =
        document.getElementById("packageTitle");

    title.textContent =
        packageNames[packageId] || packageId;

    container.innerHTML = "";

    if(filtered.length === 0){

        container.innerHTML = `
            <div style="
                padding:30px;
                color:#9299a8;
                font-size:16px;
            ">
                لا توجد قنوات في هذه الباقة
            </div>
        `;

        return;
    }


    filtered.forEach(
        (channel,index) => {

            const item =
                document.createElement("div");

            item.className = "channel";

            item.tabIndex = 0;

            item.innerHTML = `

                <div class="channel-logo">
                    ${index + 1}
                </div>

                <div class="channel-name">
                    ${channel.name}
                </div>

            `;


            item.addEventListener(
                "click",
                function(){

                    openChannel(channel);

                }
            );


            item.addEventListener(
                "keydown",
                function(event){

                    if(
                        event.key === "Enter" ||
                        event.key === " "
                    ){

                        event.preventDefault();

                        openChannel(channel);

                    }

                }
            );


            container.appendChild(item);

        }
    );

}


/* =====================================
   OPEN CHANNEL
   ===================================== */

function openChannel(channel){

    if(!channel || !channel.url){

        alert("رابط القناة غير موجود");

        return;

    }


    const player =
        document.getElementById("player");

    const video =
        document.getElementById("video");


    player.style.display = "flex";


    /*
       نستخدم player.js إذا كانت
       دالة playChannel موجودة.
    */

    if(
        typeof playChannel === "function"
    ){

        playChannel(channel.url);

    }else{

        video.src =
            channel.url;

        video.load();

        video.play().catch(
            error =>
                console.log(error)
        );

    }

}


/* =====================================
   CLOSE PLAYER
   ===================================== */

document
    .getElementById("closePlayer")
    .addEventListener(
        "click",
        function(){

            if(
                typeof stopChannel === "function"
            ){

                stopChannel();

            }else{

                const video =
                    document.getElementById("video");

                video.pause();

                video.removeAttribute("src");

                video.load();

            }

            document
                .getElementById("player")
                .style.display = "none";

        }
    );


/* =====================================
   PACKAGE BUTTONS
   ===================================== */

document
    .querySelectorAll(".package")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                function(){

                    document
                        .querySelectorAll(".package")
                        .forEach(
                            b =>
                                b.classList.remove(
                                    "active"
                                )
                        );

                    this.classList.add("active");

                    showPackage(
                        this.dataset.package
                    );

                }
            );

        }
    );


/* =====================================
   KEYBOARD / TV REMOTE
   ===================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape" ||
            event.key === "Backspace"
        ){

            const player =
                document.getElementById("player");

            if(
                player.style.display === "flex"
            ){

                if(
                    typeof stopChannel === "function"
                ){

                    stopChannel();

                }

                player.style.display = "none";

                event.preventDefault();

            }

        }

    }
);


/* =====================================
   START
   ===================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        showPackage("bein");

    }
);

</script>

</body>
</html>
