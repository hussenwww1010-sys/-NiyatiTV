<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Niyati TV</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #080b12;
    color: white;
    font-family: Arial, sans-serif;
}


/* =========================================================
   HEADER
========================================================= */

header {

    height: 75px;

    display: flex;

    align-items: center;

    padding: 0 25px;

    background: #10151f;

    border-bottom: 1px solid #202735;
}

.logo {

    width: 48px;

    height: 48px;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #e91542,
            #ff5c7a
        );

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 20px;

    font-weight: bold;
}

.title {

    margin-right: 14px;
}

.title h1 {

    font-size: 22px;
}

.title span {

    color: #9299a8;

    font-size: 12px;
}


/* =========================================================
   MAIN
========================================================= */

main {

    display: flex;

    gap: 22px;

    padding: 22px;

    min-height:
        calc(100vh - 75px);
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {

    width: 230px;

    flex-shrink: 0;

    background: #10151f;

    border-radius: 18px;

    padding: 18px;

    max-height:
        calc(100vh - 120px);

    overflow-y: auto;
}

.sidebar h2 {

    color: #b8bfcd;

    font-size: 17px;

    margin-bottom: 15px;
}

.package {

    width: 100%;

    border: 0;

    border-radius: 12px;

    padding: 14px;

    margin-bottom: 9px;

    background: #171d28;

    color: white;

    text-align: right;

    cursor: pointer;

    font-size: 15px;

    transition: .2s;
}

.package:hover,
.package:focus {

    outline: none;

    background: #252d3c;
}

.package.active {

    background: #e91542;

    box-shadow:
        0 5px 18px
        rgba(233,21,66,.20);
}


/* =========================================================
   CONTENT
========================================================= */

.content {

    flex: 1;

    min-width: 0;
}

.content h2 {

    margin-bottom: 18px;

    font-size: 21px;
}


/* =========================================================
   CHANNEL GRID
========================================================= */

.channels {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(190px, 1fr)
        );

    gap: 15px;
}


/* =========================================================
   CHANNEL
========================================================= */

.channel {

    background: #111722;

    border: 1px solid #202735;

    border-radius: 16px;

    padding: 18px;

    min-height: 125px;

    cursor: pointer;

    transition: .2s;

    display: flex;

    flex-direction: column;

    justify-content: center;
}

.channel:hover {

    border-color: #e91542;

    transform:
        translateY(-2px);
}

.channel:focus {

    outline:
        3px solid #e91542;

    outline-offset: 2px;
}


/* =========================================================
   CHANNEL LOGO
========================================================= */

.channel-logo {

    width: 58px;

    height: 58px;

    border-radius: 12px;

    background: #202735;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 12px;

    font-weight: bold;

    font-size: 17px;

    overflow: hidden;
}

.channel-logo img {

    width: 100%;

    height: 100%;

    object-fit: contain;

    padding: 5px;
}


/* =========================================================
   CHANNEL NAME
========================================================= */

.channel-name {

    font-size: 14px;

    font-weight: bold;

    line-height: 1.5;
}


/* =========================================================
   QUALITY
========================================================= */

.channel-quality {

    margin-top: 7px;

    display: inline-flex;

    width: fit-content;

    padding: 4px 8px;

    border-radius: 7px;

    background: #202735;

    color: #cbd1dc;

    font-size: 11px;

    font-weight: bold;
}


/* =========================================================
   EMPTY
========================================================= */

.empty {

    background: #111722;

    border: 1px solid #202735;

    border-radius: 16px;

    padding: 30px;

    color: #9299a8;

    text-align: center;
}


/* =========================================================
   PLAYER
========================================================= */

.player {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 9999;

    background: #000;

    align-items: center;

    justify-content: center;
}

.player video {

    width: 100%;

    height: 100%;

    object-fit: contain;

    background: #000;
}


/* =========================================================
   CLOSE BUTTON
========================================================= */

.close {

    position: absolute;

    top: 20px;

    right: 20px;

    z-index: 10000;

    background:
        rgba(0,0,0,.75);

    color: white;

    border: 0;

    border-radius: 10px;

    padding: 12px 18px;

    font-size: 15px;

    cursor: pointer;
}

.close:hover,
.close:focus {

    outline:
        2px solid white;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    main {

        flex-direction: column;

        padding: 12px;

    }

    .sidebar {

        width: 100%;

        max-height: none;

    }

    .channels {

        grid-template-columns:
            repeat(2, 1fr);

    }

}


/* =========================================================
   TV SCREEN
========================================================= */

@media (min-width: 1000px) {

    .channel {

        min-height: 135px;

    }

    .channel-name {

        font-size: 16px;

    }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
======================================================== -->

<header>

    <div class="logo">
        NT
    </div>

    <div class="title">

        <h1>
            Niyati TV
        </h1>

        <span>
            IPTV Platform
        </span>

    </div>

</header>



<!-- =======================================================
     MAIN
======================================================== -->

<main>


    <!-- ===================================================
         SIDEBAR
    ==================================================== -->

    <aside class="sidebar">

        <h2>
            الباقات
        </h2>


        <button
            class="package active"
            data-package="bein"
            tabindex="0">

            ⚽ beIN SPORTS

        </button>


        <button
            class="package"
            data-package="alwan"
            tabindex="0">

            🏆 ALWAN SPORT

        </button>


        <button
            class="package"
            data-package="shahid"
            tabindex="0">

            ⭐ SHAHID SPORTS

        </button>


        <button
            class="package"
            data-package="shasha"
            tabindex="0">

            🎯 SHASHA

        </button>


        <button
            class="package"
            data-package="dazn"
            tabindex="0">

            🏎️ DAZN

        </button>


        <button
            class="package"
            data-package="thamanya"
            tabindex="0">

            📺 THAMANYA

        </button>


        <button
            class="package"
            data-package="alkass"
            tabindex="0">

            🏆 ALKASS SPORT

        </button>


        <button
            class="package"
            data-package="ad"
            tabindex="0">

            🇦🇪 AD SPORT

        </button>


        <button
            class="package"
            data-package="dubai"
            tabindex="0">

            📡 DUBAI SPORT

        </button>


        <button
            class="package"
            data-package="iraqia"
            tabindex="0">

            🇮🇶 IRAQIA SPORT

        </button>


    </aside>



    <!-- ===================================================
         CONTENT
    ==================================================== -->

    <section class="content">


        <h2 id="packageTitle">
            beIN SPORTS
        </h2>


        <div
            class="channels"
            id="channels">

        </div>


    </section>


</main>



<!-- =======================================================
     PLAYER
======================================================== -->

<div
    class="player"
    id="player">


    <button
        class="close"
        id="closePlayer">

        رجوع

    </button>


    <video
        id="video"
        controls
        playsinline>

    </video>


</div>



<!-- =======================================================
     CHANNEL DATA
======================================================== -->

<script src="channels.js"></script>



<!-- =======================================================
     PLAYER
======================================================== -->

<script src="player.js"></script>



<script>

/* =========================================================
   PACKAGE NAMES
========================================================= */

const packageNames = {

    bein:
        "beIN SPORTS",

    alwan:
        "ALWAN SPORT",

    shahid:
        "SHAHID SPORTS",

    shasha:
        "SHASHA",

    dazn:
        "DAZN",

    thamanya:
        "THAMANYA",

    alkass:
        "ALKASS SPORT",

    ad:
        "AD SPORT",

    dubai:
        "DUBAI SPORT",

    iraqia:
        "IRAQIA SPORT"

};


/* =========================================================
   PACKAGE KEYS
========================================================= */

const packageKeys = {

    bein:
        "beIN SPORTS",

    alwan:
        "ALWAN SPORT",

    shahid:
        "SHAHID SPORTS",

    shasha:
        "SHASHA",

    dazn:
        "DAZN",

    thamanya:
        "THAMANYA",

    alkass:
        "ALKASS SPORT",

    ad:
        "AD SPORT",

    dubai:
        "DUBAI SPORT",

    iraqia:
        "IRAQIA SPORT"

};


/* =========================================================
   GET CHANNELS
========================================================= */

function getChannels() {

    if (
        typeof channels !== "undefined" &&
        Array.isArray(channels)
    ) {

        return channels;

    }

    console.error(
        "channels.js not found"
    );

    return [];

}


/* =========================================================
   SHOW PACKAGE
========================================================= */

function showPackage(packageId) {

    const allChannels =
        getChannels();


    const realPackage =
        packageKeys[packageId];


    const filteredChannels =
        allChannels.filter(

            function(channel) {

                return (
                    channel.package ===
                    realPackage
                );

            }

        );


    const container =
        document.getElementById(
            "channels"
        );


    const title =
        document.getElementById(
            "packageTitle"
        );


    title.textContent =
        packageNames[packageId];


    container.innerHTML = "";


    /* =====================================================
       NO CHANNELS
    ===================================================== */

    if (
        filteredChannels.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                لا توجد قنوات في هذه الباقة

            </div>

        `;

        return;

    }


    /* =====================================================
       CREATE CHANNELS
    ===================================================== */

    filteredChannels.forEach(

        function(channel, index) {


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "channel";


            item.tabIndex = 0;


            /* =================================================
               LOGO
            ================================================= */

            let logoHTML = "";


            if (
                channel.logo
            ) {

                logoHTML = `

                    <img
                        src="${channel.logo}"
                        alt=""
                        loading="lazy"
                        onerror="
                            this.style.display='none';
                            this.parentElement.textContent='${index + 1}';
                        "
                    >

                `;

            }

            else {

                logoHTML =
                    `${index + 1}`;

            }


            /* =================================================
               QUALITY
            ================================================= */

            let qualityHTML = "";


            if (
                channel.quality
            ) {

                qualityHTML = `

                    <div class="channel-quality">

                        ${channel.quality}

                    </div>

                `;

            }


            /* =================================================
               CHANNEL CONTENT
            ================================================= */

            item.innerHTML = `

                <div class="channel-logo">

                    ${logoHTML}

                </div>

                <div class="channel-name">

                    ${channel.name}

                </div>

                ${qualityHTML}

            `;


            /* =================================================
               CLICK
            ================================================= */

            item.addEventListener(

                "click",

                function() {

                    openChannel(
                        channel
                    );

                }

            );


            /* =================================================
               REMOTE / KEYBOARD
            ================================================= */

            item.addEventListener(

                "keydown",

                function(event) {

                    if (
                        event.key ===
                        "Enter" ||

                        event.key ===
                        " "
                    ) {

                        event.preventDefault();


                        openChannel(
                            channel
                        );

                    }

                }

            );


            container.appendChild(
                item
            );


        }

    );

}


/* =========================================================
   OPEN CHANNEL
========================================================= */

function openChannel(channel) {

    if (
        !channel ||
        !channel.url
    ) {

        alert(
            "رابط القناة غير موجود"
        );

        return;

    }


    const playerBox =
        document.getElementById(
            "player"
        );


    playerBox.style.display =
        "flex";


    /* =====================================================
       USE player.js
    ===================================================== */

    if (
        typeof playChannel ===
        "function"
    ) {

        playChannel(
            channel.url
        );

    }

    else {

        const video =
            document.getElementById(
                "video"
            );


        video.src =
            channel.url;


        video.load();


        video.play().catch(

            function(error) {

                console.log(
                    error
                );

            }

        );

    }

}


/* =========================================================
   CLOSE PLAYER
========================================================= */

function closePlayer() {

    const playerBox =
        document.getElementById(
            "player"
        );


    if (
        typeof stopChannel ===
        "function"
    ) {

        stopChannel();

    }

    else {

        const video =
            document.getElementById(
                "video"
            );


        video.pause();


        video.removeAttribute(
            "src"
        );


        video.load();

    }


    playerBox.style.display =
        "none";

}


/* =========================================================
   CLOSE PLAYER BUTTON
========================================================= */

document
    .getElementById(
        "closePlayer"
    )
    .addEventListener(

        "click",

        function() {

            closePlayer();

        }

    );


/* =========================================================
   PACKAGE BUTTONS
========================================================= */

document
    .querySelectorAll(
        ".package"
    )
    .forEach(

        function(button) {


            button.addEventListener(

                "click",

                function() {


                    document
                        .querySelectorAll(
                            ".package"
                        )
                        .forEach(

                            function(btn) {

                                btn.classList
                                    .remove(
                                        "active"
                                    );

                            }

                        );


                    this.classList.add(
                        "active"
                    );


                    showPackage(
                        this.dataset
                            .package
                    );


                }

            );


        }

    );


/* =========================================================
   TV REMOTE
========================================================= */

document.addEventListener(

    "keydown",

    function(event) {


        const playerBox =
            document.getElementById(
                "player"
            );


        /* ===================================================
           BACK / ESCAPE
        =================================================== */

        if (

            event.key ===
                "Escape" ||

            event.key ===
                "Backspace"

        ) {


            if (
                playerBox.style.display
                === "flex"
            ) {


                closePlayer();


                event.preventDefault();


                return;

            }

        }


        /* ===================================================
           OK / ENTER
        =================================================== */

        if (
            event.key ===
            "Enter"
        ) {


            const active =
                document.activeElement;


            if (
                active &&
                active.classList
                    .contains(
                        "channel"
                    )
            ) {

                openChannel(
                    active
                );

            }

        }

    }

);


/* =========================================================
   START APP
========================================================= */

document.addEventListener(

    "DOMContentLoaded",

    function() {

        showPackage(
            "bein"
        );

    }

);

</script>


</body>

</html>
