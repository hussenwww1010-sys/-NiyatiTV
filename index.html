<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070a10">

<title>Niyati TV</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#070a10;
    --panel:#101722;
    --card:#151e2b;
    --card2:#0c121b;
    --line:rgba(255,255,255,.07);
    --text:#f7f9fc;
    --muted:#8994a6;
    --gold:#e7b45a;
    --gold-light:#f5d796;
    --green:#27df88;
}

html,
body{
    min-height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Tahoma,sans-serif;
}

body{
    background:
        radial-gradient(
            circle at 80% 0,
            rgba(231,180,90,.09),
            transparent 30%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(45,80,120,.12),
            transparent 35%
        ),
        var(--bg);
}

button{
    font:inherit;
    color:inherit;
}

::-webkit-scrollbar{
    width:6px;
}

::-webkit-scrollbar-thumb{
    background:#293344;
    border-radius:20px;
}

/* =========================
   HEADER
========================= */

header{
    height:74px;
    display:flex;
    align-items:center;
    padding:0 28px;

    background:rgba(7,10,16,.94);

    border-bottom:
        1px solid var(--line);

    position:sticky;
    top:0;

    z-index:20;

    backdrop-filter:blur(18px);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:46px;
    height:46px;

    border-radius:14px;

    display:grid;
    place-items:center;

    background:
        linear-gradient(
            145deg,
            var(--gold-light),
            #b87925
        );

    color:#17120a;

    font-size:17px;
    font-weight:1000;

    box-shadow:
        0 8px 28px
        rgba(231,180,90,.18);
}

.brand h1{
    font-size:20px;
    font-weight:900;
}

.brand small{
    display:block;

    color:#687386;

    font-size:8px;

    letter-spacing:2px;

    margin-top:3px;
}

.status{
    margin-right:auto;

    display:flex;
    align-items:center;

    gap:8px;

    padding:9px 13px;

    border:
        1px solid var(--line);

    border-radius:10px;

    background:
        rgba(255,255,255,.025);

    color:#8d98aa;

    font-size:10px;

    font-weight:700;
}

.status i{
    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 12px
        rgba(39,223,136,.7);
}

/* =========================
   MAIN LAYOUT
========================= */

.layout{
    display:grid;

    grid-template-columns:
        245px
        minmax(0,1fr);

    gap:18px;

    max-width:1700px;

    margin:auto;

    padding:
        18px
        22px
        30px;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    height:
        calc(100vh - 112px);

    min-height:480px;

    position:sticky;

    top:92px;

    overflow:auto;

    padding:14px;

    border:
        1px solid var(--line);

    border-radius:18px;

    background:
        linear-gradient(
            180deg,
            #121923,
            #0a0f16
        );

    box-shadow:
        0 24px 70px
        rgba(0,0,0,.25);
}

.side-title{
    padding:
        5px
        8px
        14px;
}

.side-title b{
    font-size:14px;
}

.side-title span{
    display:block;

    color:#5e697a;

    font-size:9px;

    margin-top:5px;
}

.package{
    width:100%;

    min-height:49px;

    border:
        1px solid transparent;

    border-radius:12px;

    background:
        rgba(255,255,255,.035);

    display:flex;

    align-items:center;

    gap:10px;

    padding:
        0
        11px;

    margin-bottom:7px;

    text-align:right;

    cursor:pointer;

    transition:.15s;
}

.package .ico{
    width:28px;
    height:28px;

    border-radius:8px;

    display:grid;

    place-items:center;

    background:
        rgba(255,255,255,.06);

    font-size:13px;
}

.package .name{
    flex:1;

    font-size:11px;

    font-weight:800;
}

.package .arrow{
    color:#566173;
}

.package:hover,
.package:focus{
    outline:none;

    color:#fff;

    border-color:
        rgba(231,180,90,.55);

    background:
        rgba(255,255,255,.07);

    box-shadow:
        0 0 0 3px
        rgba(231,180,90,.08);
}

.package.active{
    color:#17120a;

    background:
        linear-gradient(
            135deg,
            var(--gold-light),
            var(--gold)
        );

    border-color:
        rgba(255,255,255,.25);

    box-shadow:
        0 12px 28px
        rgba(231,180,90,.12);
}

.package.active .ico{
    background:
        rgba(0,0,0,.1);
}

.package.active .arrow{
    color:#342716;
}

/* =========================
   CONTENT
========================= */

.content{
    min-width:0;

    display:flex;

    flex-direction:column;

    gap:16px;
}

/* =========================
   PLAYER
========================= */

.hero{
    position:relative;

    min-height:330px;

    border:
        1px solid var(--line);

    border-radius:20px;

    overflow:hidden;

    background:#000;

    box-shadow:
        0 24px 70px
        rgba(0,0,0,.3);
}

#videoContainer{
    position:relative;

    min-height:330px;

    background:#000;
}

video{
    width:100%;
    height:100%;

    min-height:330px;

    display:block;

    object-fit:contain;

    background:#000;
}

.empty{
    position:absolute;

    inset:0;

    display:grid;

    place-items:center;

    pointer-events:none;

    background:
        radial-gradient(
            circle,
            rgba(231,180,90,.07),
            transparent 45%
        );
}

.empty div{
    text-align:center;
}

.empty strong{
    display:grid;

    place-items:center;

    width:70px;
    height:70px;

    margin:
        auto
        auto
        12px;

    border-radius:20px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.09);

    color:var(--gold);

    font-size:23px;

    font-weight:1000;
}

.empty b{
    font-size:14px;
}

.empty small{
    display:block;

    margin-top:6px;

    color:#667184;

    font-size:10px;
}

.overlay{
    position:absolute;

    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.62),
            transparent 45%
        ),
        linear-gradient(
            0deg,
            rgba(0,0,0,.65),
            transparent 35%
        );
}

.now{
    position:absolute;

    right:22px;
    top:20px;

    z-index:2;

    max-width:50%;
}

.live{
    display:inline-flex;

    align-items:center;

    gap:6px;

    padding:
        6px
        9px;

    border-radius:7px;

    background:
        rgba(8,11,16,.72);

    border:
        1px solid
        rgba(255,255,255,.09);

    font-size:9px;

    font-weight:900;
}

.live i{
    width:6px;
    height:6px;

    border-radius:50%;

    background:var(--green);
}

.now h2{
    font-size:24px;

    margin-top:12px;

    text-shadow:
        0 4px 20px #000;
}

.now p{
    font-size:10px;

    color:#b4bdca;

    margin-top:5px;
}

.fullscreen{
    position:absolute;

    left:18px;
    bottom:18px;

    z-index:5;

    width:42px;
    height:42px;

    border:
        1px solid
        rgba(255,255,255,.13);

    border-radius:11px;

    background:
        rgba(8,11,16,.72);

    cursor:pointer;

    font-size:17px;
}

.fullscreen:focus{
    outline:none;

    border-color:
        var(--gold);

    box-shadow:
        0 0 0 3px
        rgba(231,180,90,.16);
}

/* =========================
   CHANNEL HEADER
========================= */

.head{
    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0
        3px;
}

.head h2{
    font-size:18px;

    font-weight:900;
}

.head h2:before{
    content:"";

    display:inline-block;

    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--gold);

    box-shadow:
        0 0 12px
        rgba(231,180,90,.7);

    margin-left:9px;
}

.count{
    padding:
        7px
        10px;

    border:
        1px solid var(--line);

    border-radius:8px;

    background:
        rgba(255,255,255,.025);

    color:#718096;

    font-size:9px;
}

/* =========================
   CHANNELS
========================= */

.channels{
    display:grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:9px;
}

.channel{
    min-height:72px;

    display:flex;

    align-items:center;

    gap:12px;

    padding:
        9px
        12px;

    border:
        1px solid var(--line);

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            var(--card),
            var(--card2)
        );

    cursor:pointer;

    transition:.15s;

    text-align:right;
}

.channel:hover,
.channel:focus{
    outline:none;

    transform:
        translateY(-2px);

    border-color:
        rgba(231,180,90,.6);

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.22),
        0 0 0 3px
        rgba(231,180,90,.08);
}

.channel.active{
    border-color:
        rgba(231,180,90,.75);

    background:
        linear-gradient(
            135deg,
            #2c251a,
            #101720
        );
}

.channel-logo{
    width:48px;
    height:48px;

    flex:0 0 48px;

    border-radius:12px;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid
        rgba(255,255,255,.08);

    display:grid;

    place-items:center;

    overflow:hidden;

    color:#dce2eb;

    font-size:12px;

    font-weight:900;
}

.channel-logo img{
    width:100%;
    height:100%;

    object-fit:contain;
}

.channel-main{
    min-width:0;

    flex:1;
}

.channel-name{
    display:block;

    font-size:12px;

    font-weight:900;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.channel-package{
    display:block;

    font-size:8px;

    color:#667285;

    margin-top:5px;
}

.quality-row{
    display:flex;

    gap:4px;

    margin-top:6px;
}

.quality{
    padding:
        3px
        6px;

    border-radius:5px;

    background:
        rgba(255,255,255,.055);

    color:#8e99aa;

    font-size:7px;

    font-weight:900;
}

.quality:first-child{
    color:#e9c57f;
}

.play{
    width:30px;
    height:30px;

    border-radius:9px;

    display:grid;

    place-items:center;

    background:
        rgba(231,180,90,.09);

    color:var(--gold);

    font-size:12px;
}

.empty-list{
    padding:35px;

    text-align:center;

    color:#647083;

    border:
        1px dashed
        var(--line);

    border-radius:14px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .layout{
        grid-template-columns:1fr;
    }

    .sidebar{
        position:relative;

        top:auto;

        height:auto;

        min-height:0;
    }

    .channels{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){

    header{
        padding:
            0
            15px;
    }

    .layout{
        padding:12px;
    }

    .status{
        display:none;
    }

    .hero,
    #videoContainer,
    video{
        min-height:220px;
    }

    .now h2{
        font-size:18px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header>

    <div class="brand">

        <div class="logo">
            NT
        </div>

        <div>

            <h1>
                Niyati TV
            </h1>

            <small>
                PREMIUM LIVE TELEVISION
            </small>

        </div>

    </div>

    <div class="status">

        <i></i>

        <span>
            البث المباشر متاح
        </span>

    </div>

</header>


<!-- =========================
     APP
========================= -->

<div class="layout">


    <!-- SIDEBAR -->

    <aside
        class="sidebar"
        id="packagesLayout"
    >

        <div class="side-title">

            <b>
                الباقات
            </b>

            <span>
                اختر باقة لمشاهدة القنوات
            </span>

        </div>

    </aside>


    <!-- CONTENT -->

    <main class="content">


        <!-- PLAYER -->

        <section class="hero">

            <div
                id="videoContainer"
            >

                <video
                    id="video"
                    playsinline
                ></video>


                <div
                    class="empty"
                    id="playerEmpty"
                >

                    <div>

                        <strong>
                            NT
                        </strong>

                        <b>
                            اختر قناة للبدء
                        </b>

                        <small>
                            استخدم الريموت للتنقل ثم اضغط OK
                        </small>

                    </div>

                </div>


                <div class="overlay"></div>


                <div class="now">

                    <span class="live">

                        <i></i>

                        LIVE

                    </span>

                    <h2 id="nowPlaying">
                        Niyati TV
                    </h2>

                    <p id="nowPlayingSub">
                        جاهز للبث المباشر
                    </p>

                </div>


                <button
                    class="fullscreen"
                    id="fullscreenButton"
                    aria-label="ملء الشاشة"
                >
                    ⛶
                </button>

            </div>

        </section>


        <!-- CHANNELS -->

        <section>

            <div class="head">

                <h2 id="channelTitle">
                    كل القنوات
                </h2>

                <span
                    class="count"
                    id="channelCount"
                >
                    0 قناة
                </span>

            </div>


            <div
                class="channels"
                id="channelsLayout"
            ></div>

        </section>

    </main>

</div>


<!-- =========================
     EXISTING PROJECT FILES
========================= -->

<script src="channels.js"></script>

<script src="player.js"></script>


<!-- =========================
     DESIGN 2 CONTROLLER
========================= -->

<script>

(function(){

    const packagesLayout =
        document.getElementById(
            "packagesLayout"
        );

    const channelsLayout =
        document.getElementById(
            "channelsLayout"
        );

    const channelTitle =
        document.getElementById(
            "channelTitle"
        );

    const channelCount =
        document.getElementById(
            "channelCount"
        );

    const nowPlaying =
        document.getElementById(
            "nowPlaying"
        );

    const nowPlayingSub =
        document.getElementById(
            "nowPlayingSub"
        );

    const playerEmpty =
        document.getElementById(
            "playerEmpty"
        );

    const video =
        document.getElementById(
            "video"
        );

    const fullscreenButton =
        document.getElementById(
            "fullscreenButton"
        );


    let selectedPackage = "ALL";

    let currentChannel = null;


    /*
     * تأكد أن channels.js اشتغل
     */

    if(
        typeof channels === "undefined" ||
        !Array.isArray(channels)
    ){

        channelsLayout.innerHTML =

            '<div class="empty-list">' +

            'تعذر تحميل قائمة القنوات.' +

            '</div>';

        return;
    }


    /*
     * استخراج الباقات تلقائياً
     */

    const packages = [

        ...new Set(

            channels

                .map(
                    channel =>
                        channel.package
                )

                .filter(Boolean)

        )

    ];


    const icons = [

        "◈",
        "◉",
        "◆",
        "◇",
        "●",
        "✦",
        "▣",
        "★",
        "◌",
        "▲",
        "■",
        "✧"

    ];


    /*
     * إنشاء زر الباقة
     */

    function createPackageButton(
        name,
        index
    ){

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "package";


        if(
            selectedPackage === name
        ){

            button.classList.add(
                "active"
            );

        }


        button.tabIndex = 0;


        button.innerHTML =

            '<span class="ico">' +

                icons[
                    index %
                    icons.length
                ] +

            '</span>' +

            '<span class="name">' +

                name +

            '</span>' +

            '<span class="arrow">' +

                '‹' +

            '</span>';


        button.onclick =
            function(){

                selectPackage(name);

            };


        return button;
    }


    /*
     * بناء الباقات
     */

    function renderPackages(){

        packagesLayout

            .querySelectorAll(
                ".package"
            )

            .forEach(
                element =>
                    element.remove()
            );


        packagesLayout.appendChild(

            createPackageButton(
                "ALL",
                0
            )

        );


        packages.forEach(
            function(packageName,index){

                packagesLayout.appendChild(

                    createPackageButton(
                        packageName,
                        index + 1
                    )

                );

            }
        );

    }


    /*
     * عرض القنوات
     */

    function renderChannels(){

        const list =

            selectedPackage === "ALL"

                ? channels

                : channels.filter(
                    channel =>
                        channel.package ===
                        selectedPackage
                );


        channelsLayout.innerHTML = "";


        channelTitle.textContent =

            selectedPackage === "ALL"

                ? "كل القنوات"

                : selectedPackage;


        channelCount.textContent =

            list.length +
            " قناة";


        if(!list.length){

            channelsLayout.innerHTML =

                '<div class="empty-list">' +

                'لا توجد قنوات في هذه الباقة.' +

                '</div>';

            return;
        }


        list.forEach(
            function(channel,index){

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "channel";


                if(
                    currentChannel &&
                    currentChannel.id ===
                    channel.id
                ){

                    button.classList.add(
                        "active"
                    );

                }


                button.tabIndex = 0;


                const qualities =

                    Array.isArray(
                        channel.qualities
                    )

                        ? channel.qualities

                        : [];


                let logo = "NT";


                if(channel.logo){

                    logo =

                        '<img src="' +
                        channel.logo +
                        '" ' +
                        'onerror="' +
                        "this.style.display='none'" +
                        '">';

                }


                const qualityHTML =

                    qualities

                        .slice(0,4)

                        .map(
                            function(quality){

                                return

                                    '<span class="quality">' +

                                    quality.name +

                                    '</span>';

                            }
                        )

                        .join("");


                button.innerHTML =

                    '<span class="channel-logo">' +

                        logo +

                    '</span>' +

                    '<span class="channel-main">' +

                        '<span class="channel-name">' +

                            channel.name +

                        '</span>' +

                        '<span class="channel-package">' +

                            (
                                channel.package ||
                                "Niyati TV"
                            ) +

                        '</span>' +

                        '<span class="quality-row">' +

                            qualityHTML +

                        '</span>' +

                    '</span>' +

                    '<span class="play">' +

                        '▶' +

                    '</span>';


                button.onclick =
                    function(){

                        playChannelFromUI(
                            channel,
                            0
                        );

                    };


                button.onkeydown =
                    function(event){

                        if(
                            event.key ===
                            "Enter" ||

                            event.key ===
                            " "
                        ){

                            event.preventDefault();

                            playChannelFromUI(
                                channel,
                                0
                            );

                        }

                    };


                channelsLayout.appendChild(
                    button
                );

            }
        );

    }


    /*
     * اختيار الباقة
     */

    function selectPackage(name){

        selectedPackage =
            name;


        renderPackages();

        renderChannels();


        setTimeout(
            function(){

                const firstChannel =
                    channelsLayout.querySelector(
                        ".channel"
                    );


                if(firstChannel){

                    firstChannel.focus();

                }

            },
            30
        );

    }


    /*
     * تشغيل القناة
     */

    function playChannelFromUI(
        channel,
        qualityIndex
    ){

        currentChannel =
            channel;


        const qualities =

            Array.isArray(
                channel.qualities
            )

                ? channel.qualities

                : [];


        const quality =

            qualities[
                qualityIndex
            ] ||

            qualities[0];


        if(
            !quality ||
            !quality.url
        ){

            return;

        }


        nowPlaying.textContent =
            channel.name;


        nowPlayingSub.textContent =

            (
                channel.package ||
                "Niyati TV"
            ) +

            " • " +

            (
                quality.name ||
                "LIVE"
            );


        playerEmpty.style.display =
            "none";


        channelsLayout

            .querySelectorAll(
                ".channel"
            )

            .forEach(
                element =>
                    element.classList.remove(
                        "active"
                    )
            );


        /*
         * استعمال مشغل المشروع الحالي
         */

        if(
            typeof playChannel ===
            "function"
        ){

            playChannel(
                quality.url
            );

        }

    }


    /*
     * Fullscreen
     */

    fullscreenButton.onclick =
        function(){

            const target =
                document.getElementById(
                    "videoContainer"
                );


            if(
                document.fullscreenElement
            ){

                document
                    .exitFullscreen()
                    .catch(
                        function(){}
                    );

            }

            else if(
                target.requestFullscreen
            ){

                target
                    .requestFullscreen()
                    .catch(
                        function(){}
                    );

            }

        };


    /*
     * عند بدء الفيديو
     */

    video.addEventListener(
        "play",
        function(){

            playerEmpty.style.display =
                "none";

        }
    );


    /*
     * Back / Escape
     */

    document.addEventListener(
        "keydown",
        function(event){

            if(
                event.key ===
                "Escape" &&
                document.fullscreenElement
            ){

                document
                    .exitFullscreen()
                    .catch(
                        function(){}
                    );

            }

        }
    );


    /*
     * تشغيل الواجهة
     */

    renderPackages();

    renderChannels();


    /*
     * التركيز على أول باقة
     */

    const firstPackage =
        packagesLayout.querySelector(
            ".package"
        );


    if(firstPackage){

        firstPackage.focus();

    }

})();

</script>

</body>
</html>
