<!-- =========================================================
     NIYATI TV PLAYER
     HLS + DASH + MPEG-TS + MP4 + WEBM + OGG
========================================================= -->

<script>

let mpegPlayer = null;

let hlsPlayer = null;

let dashPlayer = null;

let currentUrl = null;

let retryTimer = null;

let retryCount = 0;

const MAX_RETRIES = 5;

const RETRY_DELAY = 3000;

const video =
    document.getElementById("video");


/* =========================================================
   STOP PLAYER
========================================================= */

function stopChannel(){

    clearTimeout(
        retryTimer
    );

    retryTimer = null;


    try{

        if(mpegPlayer){

            mpegPlayer.pause();

            mpegPlayer.unload();

            mpegPlayer.detachMediaElement();

            mpegPlayer.destroy();
        }

    }catch(e){}

    mpegPlayer = null;


    try{

        if(hlsPlayer){

            hlsPlayer.destroy();
        }

    }catch(e){}

    hlsPlayer = null;


    try{

        if(dashPlayer){

            dashPlayer.reset();
        }

    }catch(e){}

    dashPlayer = null;


    if(video){

        try{

            video.pause();

            video.removeAttribute(
                "src"
            );

            video.load();

        }catch(e){}
    }
}


/* =========================================================
   LOAD SCRIPT
========================================================= */

function loadScript(src){

    return new Promise(
        function(resolve,reject){

            const old =
                document.querySelector(
                    `script[src="${src}"]`
                );


            if(old){

                if(
                    src.includes("hls.js") &&
                    window.Hls
                ){

                    resolve();

                    return;
                }


                if(
                    src.includes("mpegts.js") &&
                    window.mpegts
                ){

                    resolve();

                    return;
                }


                if(
                    src.includes("dash.all") &&
                    window.dashjs
                ){

                    resolve();

                    return;
                }


                old.addEventListener(
                    "load",
                    resolve,
                    {once:true}
                );

                old.addEventListener(
                    "error",
                    reject,
                    {once:true}
                );

                return;
            }


            const script =
                document.createElement(
                    "script"
                );


            script.src = src;

            script.async = true;


            script.onload =
                resolve;


            script.onerror =
                function(){

                    reject(
                        new Error(
                            "تعذر تحميل مكتبة المشغل"
                        )
                    );

                };


            document.head.appendChild(
                script
            );

        }
    );
}


/* =========================================================
   DETECT TYPE
========================================================= */

function detectStreamType(url){

    if(!url){

        return "unknown";
    }


    const clean =
        url
            .split("#")[0]
            .split("?")[0]
            .toLowerCase();


    const lower =
        url.toLowerCase();


    if(
        clean.endsWith(".m3u8") ||
        lower.includes(".m3u8?")
    ){

        return "hls";
    }


    if(
        clean.endsWith(".mpd") ||
        lower.includes(".mpd?")
    ){

        return "dash";
    }


    if(
        clean.endsWith(".ts") ||
        clean.endsWith(".mpegts") ||
        clean.endsWith(".m2ts")
    ){

        return "mpegts";
    }


    if(
        clean.endsWith(".mp4") ||
        clean.endsWith(".m4v")
    ){

        return "mp4";
    }


    if(
        clean.endsWith(".webm")
    ){

        return "webm";
    }


    if(
        clean.endsWith(".ogv") ||
        clean.endsWith(".ogg")
    ){

        return "ogg";
    }


    if(
        lower.startsWith("rtmp://")
    ){

        return "rtmp";
    }


    if(
        lower.startsWith("rtsp://")
    ){

        return "rtsp";
    }


    return "unknown";
}


/* =========================================================
   NATIVE VIDEO
========================================================= */

function playNative(
    url,
    mime
){

    return new Promise(
        function(resolve,reject){

            if(!video){

                reject(
                    new Error(
                        "عنصر الفيديو غير موجود"
                    )
                );

                return;
            }


            let finished = false;


            function cleanup(){

                video.removeEventListener(
                    "loadedmetadata",
                    success
                );

                video.removeEventListener(
                    "canplay",
                    success
                );

                video.removeEventListener(
                    "error",
                    failed
                );
            }


            function success(){

                if(finished){
                    return;
                }

                finished = true;

                cleanup();

                video
                    .play()
                    .catch(
                        function(){}
                    );

                resolve();
            }


            function failed(){

                if(finished){
                    return;
                }

                finished = true;

                cleanup();

                reject(
                    new Error(
                        "المتصفح رفض تشغيل مصدر الفيديو"
                    )
                );
            }


            video.addEventListener(
                "loadedmetadata",
                success
            );


            video.addEventListener(
                "canplay",
                success
            );


            video.addEventListener(
                "error",
                failed
            );


            if(mime){

                video.setAttribute(
                    "type",
                    mime
                );
            }


            video.src = url;

            video.load();

        }
    );
}


/* =========================================================
   HLS
========================================================= */

async function playHLS(url){

    await loadScript(
        "https://cdn.jsdelivr.net/npm/hls.js@1.6.15/dist/hls.min.js"
    );


    if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        await playNative(
            url,
            "application/vnd.apple.mpegurl"
        );

        return;
    }


    if(
        window.Hls &&
        Hls.isSupported()
    ){

        hlsPlayer =
            new Hls({

                enableWorker:true,

                lowLatencyMode:true,

                backBufferLength:30,

                maxBufferLength:30,

                maxMaxBufferLength:60,

                liveSyncDurationCount:3,

                liveMaxLatencyDurationCount:6
            });


        hlsPlayer.loadSource(
            url
        );


        hlsPlayer.attachMedia(
            video
        );


        hlsPlayer.on(
            Hls.Events.MANIFEST_PARSED,
            function(){

                video
                    .play()
                    .catch(
                        function(){}
                    );

            }
        );


        hlsPlayer.on(
            Hls.Events.ERROR,
            function(
                event,
                data
            ){

                console.error(
                    "HLS ERROR:",
                    data
                );


                if(!data.fatal){
                    return;
                }


                if(
                    data.type ===
                    Hls.ErrorTypes.NETWORK_ERROR
                ){

                    try{

                        hlsPlayer.startLoad();

                    }catch(e){

                        scheduleRetry(
                            url
                        );
                    }

                }


                else if(
                    data.type ===
                    Hls.ErrorTypes.MEDIA_ERROR
                ){

                    try{

                        hlsPlayer.recoverMediaError();

                    }catch(e){

                        scheduleRetry(
                            url
                        );
                    }

                }


                else{

                    scheduleRetry(
                        url
                    );

                }

            }
        );


        return;
    }


    throw new Error(
        "HLS غير مدعوم في هذا المتصفح"
    );
}


/* =========================================================
   DASH
========================================================= */

async function playDASH(url){

    await loadScript(
        "https://cdn.jsdelivr.net/npm/dashjs@5.0.0/dist/modern/umd/dash.all.min.js"
    );


    if(!window.dashjs){

        throw new Error(
            "DASH.js غير متوفر"
        );
    }


    dashPlayer =
        dashjs
            .MediaPlayer()
            .create();


    dashPlayer.initialize(
        video,
        url,
        true
    );


    dashPlayer.updateSettings({

        streaming:{

            buffer:{

                fastSwitchEnabled:true,

                stableBufferTime:12,

                bufferTimeAtTopQuality:20,

                bufferTimeAtTopQualityLongForm:30
            },

            lowLatencyEnabled:true
        }

    });


    dashPlayer.on(
        dashjs.MediaPlayer.events.ERROR,
        function(error){

            console.error(
                "DASH ERROR:",
                error
            );

        }
    );
}


/* =========================================================
   MPEG TS
========================================================= */

async function playMPEGTS(url){

    await loadScript(
        "https://cdn.jsdelivr.net/npm/mpegts.js@1.8.0/dist/mpegts.min.js"
    );


    if(
        !window.mpegts ||
        !mpegts.isSupported()
    ){

        throw new Error(
            "MPEG-TS غير مدعوم في هذا المتصفح"
        );
    }


    mpegPlayer =
        mpegts.createPlayer(

            {
                type:
                    "mpegts",

                url:
                    url,

                isLive:
                    true
            },

            {
                enableWorker:
                    true,

                lazyLoad:
                    false,

                autoCleanupSourceBuffer:
                    true,

                liveBufferLatencyChasing:
                    true,

                liveBufferLatencyMaxLatency:
                    3,

                liveBufferLatencyMinRemain:
                    1,

                stashInitialSize:
                    384 * 1024
            }

        );


    mpegPlayer.attachMediaElement(
        video
    );


    mpegPlayer.on(
        mpegts.Events.ERROR,
        function(
            type,
            detail,
            info
        ){

            console.error(
                "MPEG-TS ERROR:",
                type,
                detail,
                info
            );


            scheduleRetry(
                url
            );

        }
    );


    mpegPlayer.load();

    await mpegPlayer.play();
}


/* =========================================================
   RETRY
========================================================= */

function scheduleRetry(url){

    if(
        retryCount >=
        MAX_RETRIES
    ){

        showPlayerError(
            "تعذر تشغيل البث بعد عدة محاولات."
        );

        return;
    }


    retryCount++;


    clearTimeout(
        retryTimer
    );


    retryTimer =
        setTimeout(
            function(){

                playChannel(
                    url,
                    true
                );

            },
            RETRY_DELAY
        );
}


/* =========================================================
   MAIN PLAY FUNCTION
========================================================= */

async function playChannel(
    url,
    isRetry=false
){

    if(!url){

        showPlayerError(
            "رابط البث فارغ."
        );

        return;
    }


    if(!isRetry){

        retryCount = 0;
    }


    stopChannel();


    currentUrl =
        url;


    hidePlayerError();


    if(
        video
    ){

        video.poster =
            "";
    }


    const type =
        detectStreamType(
            url
        );


    console.log(
        "NIYATI TV:",
        type,
        url
    );


    try{

        switch(type){

            case "hls":

                await playHLS(
                    url
                );

                break;


            case "dash":

                await playDASH(
                    url
                );

                break;


            case "mpegts":

                await playMPEGTS(
                    url
                );

                break;


            case "mp4":

                await playNative(
                    url,
                    "video/mp4"
                );

                break;


            case "webm":

                await playNative(
                    url,
                    "video/webm"
                );

                break;


            case "ogg":

                await playNative(
                    url,
                    "video/ogg"
                );

                break;


            case "rtmp":

                throw new Error(
                    "RTMP غير مدعوم مباشرة داخل المتصفح"
                );


            case "rtsp":

                throw new Error(
                    "RTSP غير مدعوم مباشرة داخل المتصفح"
                );


            default:

                /*
                 * الرابط بدون امتداد.
                 *
                 * نحاول أولاً HLS،
                 * ثم MPEG-TS،
                 * ثم Native.
                 */

                try{

                    await playHLS(
                        url
                    );

                }catch(hlsError){

                    console.warn(
                        "HLS failed:",
                        hlsError
                    );


                    stopChannel();


                    try{

                        await playMPEGTS(
                            url
                        );

                    }catch(tsError){

                        console.warn(
                            "TS failed:",
                            tsError
                        );


                        stopChannel();


                        await playNative(
                            url
                        );
                    }
                }

                break;
        }


        retryCount = 0;


        const empty =
            document.getElementById(
                "playerEmpty"
            );


        if(empty){

            empty.style.display =
                "none";
        }


        console.log(
            "NIYATI TV: PLAYING"
        );


    }catch(error){

        console.error(
            "NIYATI TV PLAYER:",
            error
        );


        showPlayerError(
            readableError(
                error,
                type
            )
        );


        scheduleRetry(
            url
        );
    }
}


/* =========================================================
   ERROR MESSAGE
========================================================= */

function readableError(
    error,
    type
){

    const message =
        error &&
        error.message
            ? error.message
            : "خطأ غير معروف";


    if(
        type === "rtsp"
    ){

        return(
            "هذا الرابط RTSP ولا يمكن للمتصفح تشغيله مباشرة."
        );
    }


    if(
        type === "rtmp"
    ){

        return(
            "هذا الرابط RTMP ولا يمكن للمتصفح تشغيله مباشرة."
        );
    }


    return(
        "تعذر تشغيل البث.\n\n" +
        "النوع: " +
        type +
        "\n\n" +
        message
    );
}


/* =========================================================
   ERROR UI
========================================================= */

function showPlayerError(
    message
){

    const box =
        document.getElementById(
            "playerError"
        );


    if(!box){
        return;
    }


    box.textContent =
        message;


    box.style.display =
        "block";
}


function hidePlayerError(){

    const box =
        document.getElementById(
            "playerError"
        );


    if(box){

        box.style.display =
            "none";

        box.textContent =
            "";
    }
}


/* =========================================================
   VIDEO EVENTS
========================================================= */

if(video){

    video.addEventListener(
        "play",
        function(){

            const empty =
                document.getElementById(
                    "playerEmpty"
                );


            if(empty){

                empty.style.display =
                    "none";
            }

        }
    );


    video.addEventListener(
        "playing",
        function(){

            hidePlayerError();

        }
    );


    video.addEventListener(
        "stalled",
        function(){

            console.warn(
                "NIYATI TV: STALLED"
            );

        }
    );


    video.addEventListener(
        "error",
        function(){

            if(
                video.error
            ){

                console.error(
                    "HTML VIDEO ERROR:",
                    video.error
                );

            }

        }
    );

}


/* =========================================================
   GLOBAL PLAYER
========================================================= */

window.NiyatiPlayer = {

    play:
        playChannel,

    stop:
        stopChannel,

    detectType:
        detectStreamType,

    currentUrl:
        function(){

            return currentUrl;

        }

};


/* =========================================================
   UI CONTROLLER
========================================================= */

(function(){

    const packagesLayout =
        document.getElementById(
            "packagesLayout"
        );


    const channelsLayout =
        document.getElementById(
            "channelsLayout"
        );


    const channelTitle =
        document.getElementById(
            "channelTitle"
        );


    const channelCount =
        document.getElementById(
            "channelCount"
        );


    const nowPlaying =
        document.getElementById(
            "nowPlaying"
        );


    const nowPlayingSub =
        document.getElementById(
            "nowPlayingSub"
        );


    const playerEmpty =
        document.getElementById(
            "playerEmpty"
        );


    const fullscreenButton =
        document.getElementById(
            "fullscreenButton"
        );


    let selectedPackage =
        "ALL";


    let currentChannel =
        null;


    /* =====================================================
       CHECK CHANNELS.JS
    ===================================================== */

    if(
        typeof channels ===
        "undefined" ||
        !Array.isArray(channels)
    ){

        channelsLayout.innerHTML =

            '<div class="empty-list">' +

            'تعذر تحميل القنوات.' +

            '<br><br>' +

            'تأكد من ملف channels.js' +

            '</div>';

        return;
    }


    /* =====================================================
       PACKAGES
    ===================================================== */

    const packages = [

        ...new Set(

            channels

                .map(
                    channel =>
                        channel.package
                )

                .filter(Boolean)

        )

    ];


    const icons = [

        "◈",
        "◉",
        "◆",
        "◇",
        "●",
        "✦",
        "▣",
        "★",
        "◌",
        "▲",
        "■",
        "✧"

    ];


    /* =====================================================
       PACKAGE BUTTON
    ===================================================== */

    function createPackageButton(
        name,
        index
    ){

        const button =
            document.createElement(
                "button"
            );


        button.className =
            "package";


        if(
            selectedPackage ===
            name
        ){

            button.classList.add(
                "active"
            );
        }


        button.type =
            "button";


        button.tabIndex =
            0;


        button.innerHTML =

            '<span class="ico">' +

                icons[
                    index %
                    icons.length
                ] +

            '</span>' +

            '<span class="name">' +

                name +

            '</span>' +

            '<span class="arrow">' +

                '‹' +

            '</span>';


        button.onclick =
            function(){

                selectPackage(
                    name
                );

            };


        return button;
    }


    /* =====================================================
       RENDER PACKAGES
    ===================================================== */

    function renderPackages(){

        packagesLayout

            .querySelectorAll(
                ".package"
            )

            .forEach(
                function(element){

                    element.remove();

                }
            );


        packagesLayout.appendChild(

            createPackageButton(
                "ALL",
                0
            )

        );


        packages.forEach(
            function(
                packageName,
                index
            ){

                packagesLayout.appendChild(

                    createPackageButton(
                        packageName,
                        index + 1
                    )

                );

            }
        );

    }


    /* =====================================================
       RENDER CHANNELS
    ===================================================== */

    function renderChannels(){

        const list =

            selectedPackage ===
            "ALL"

                ? channels

                : channels.filter(
                    function(channel){

                        return(
                            channel.package ===
                            selectedPackage
                        );

                    }
                );


        channelsLayout.innerHTML =
            "";


        channelTitle.textContent =

            selectedPackage ===
            "ALL"

                ? "كل القنوات"

                : selectedPackage;


        channelCount.textContent =

            list.length +
            " قناة";


        if(!list.length){

            channelsLayout.innerHTML =

                '<div class="empty-list">' +

                'لا توجد قنوات في هذه الباقة.' +

                '</div>';

            return;
        }


        list.forEach(
            function(
                channel,
                index
            ){

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "channel";


                button.type =
                    "button";


                button.tabIndex =
                    0;


                if(
                    currentChannel &&
                    currentChannel.id ===
                    channel.id
                ){

                    button.classList.add(
                        "active"
                    );

                }


                const qualities =

                    Array.isArray(
                        channel.qualities
                    )

                        ? channel.qualities

                        : [];


                let logo =
                    "NT";


                if(channel.logo){

                    logo =

                        '<img src="' +
                        channel.logo +
                        '" ' +
                        'alt="" ' +
                        'onerror="' +
                        "this.style.display='none'" +
                        '">';

                }


                const qualityHTML =

                    qualities

                        .slice(0,4)

                        .map(
                            function(
                                quality
                            ){

                                return(

                                    '<span class="quality">' +

                                    (
                                        quality.name ||
                                        "LIVE"
                                    ) +

                                    '</span>'

                                );

                            }
                        )

                        .join("");


                button.innerHTML =

                    '<span class="channel-logo">' +

                        logo +

                    '</span>' +

                    '<span class="channel-main">' +

                        '<span class="channel-name">' +

                            (
                                channel.name ||
                                "قناة"
                            ) +

                        '</span>' +

                        '<span class="channel-package">' +

                            (
                                channel.package ||
                                "Niyati TV"
                            ) +

                        '</span>' +

                        '<span class="quality-row">' +

                            qualityHTML +

                        '</span>' +

                    '</span>' +

                    '<span class="play">' +

                        '▶' +

                    '</span>';


                button.onclick =
                    function(){

                        playChannelFromUI(
                            channel,
                            0
                        );

                    };


                button.onkeydown =
                    function(event){

                        if(
                            event.key ===
                            "Enter" ||
                            event.key ===
                            " "
                        ){

                            event.preventDefault();


                            playChannelFromUI(
                                channel,
                                0
                            );

                        }

                    };


                channelsLayout.appendChild(
                    button
                );

            }
        );

    }


    /* =====================================================
       SELECT PACKAGE
    ===================================================== */

    function selectPackage(
        name
    ){

        selectedPackage =
            name;


        renderPackages();

        renderChannels();


        setTimeout(
            function(){

                const firstChannel =
                    channelsLayout.querySelector(
                        ".channel"
                    );


                if(firstChannel){

                    firstChannel.focus();

                }

            },
            30
        );

    }


    /* =====================================================
       PLAY CHANNEL FROM UI
    ===================================================== */

    function playChannelFromUI(
        channel,
        qualityIndex
    ){

        currentChannel =
            channel;


        const qualities =

            Array.isArray(
                channel.qualities
            )

                ? channel.qualities

                : [];


        const quality =

            qualities[
                qualityIndex
            ] ||

            qualities[0];


        if(
            !quality ||
            !quality.url
        ){

            showPlayerError(
                "هذه القناة لا تحتوي على رابط بث صالح."
            );

            return;
        }


        nowPlaying.textContent =

            channel.name ||
            "Niyati TV";


        nowPlayingSub.textContent =

            (
                channel.package ||
                "Niyati TV"
            ) +

            " • " +

            (
                quality.name ||
                "LIVE"
            );


        if(playerEmpty){

            playerEmpty.style.display =
                "none";
        }


        channelsLayout

            .querySelectorAll(
                ".channel"
            )

            .forEach(
                function(element){

                    element.classList.remove(
                        "active"
                    );

                }
            );


        /*
         * تشغيل المشغل الشامل
         */

        playChannel(
            quality.url
        );

    }


    /* =====================================================
       FULLSCREEN
    ===================================================== */

    fullscreenButton.onclick =
        function(){

            const target =
                document.getElementById(
                    "videoContainer"
                );


            if(
                document.fullscreenElement
            ){

                document
                    .exitFullscreen()
                    .catch(
                        function(){}
                    );

                return;
            }


            if(
                target.requestFullscreen
            ){

                target
                    .requestFullscreen()
                    .catch(
                        function(){}
                    );

            }

        };


    /* =====================================================
       ESCAPE
    ===================================================== */

    document.addEventListener(
        "keydown",
        function(event){

            if(
                event.key ===
                "Escape" &&
                document.fullscreenElement
            ){

                document
                    .exitFullscreen()
                    .catch(
                        function(){}
                    );

            }

        }
    );


    /* =====================================================
       START
    ===================================================== */

    renderPackages();

    renderChannels();


    const firstPackage =
        packagesLayout.querySelector(
            ".package"
        );


    if(firstPackage){

        firstPackage.focus();

    }

})();

</script>


</body>

</html>
