<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Niyati TV</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {

    background:
        radial-gradient(
            circle at top right,
            #171d2b 0,
            #080b12 45%
        );

    color: white;

    font-family:
        Arial,
        sans-serif;

    overflow-x: hidden;
}


/* =====================================================
   HEADER
===================================================== */

header {

    height: 76px;

    display: flex;

    align-items: center;

    padding: 0 25px;

    background:
        rgba(16,21,31,.96);

    border-bottom:
        1px solid #252c39;

    position: relative;

    z-index: 10;
}

.logo {

    width: 50px;

    height: 50px;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #e91542,
            #ff5c7a
        );

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 20px;

    font-weight: bold;

    box-shadow:
        0 8px 25px
        rgba(233,21,66,.25);
}

.title {

    margin-right: 14px;
}

.title h1 {

    font-size: 22px;

    letter-spacing: .3px;
}

.title span {

    color: #9299a8;

    font-size: 12px;

    display: block;

    margin-top: 3px;
}


/* =====================================================
   MAIN
===================================================== */

main {

    display: flex;

    gap: 22px;

    padding: 22px;

    min-height:
        calc(100vh - 76px);
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {

    width: 235px;

    flex-shrink: 0;

    background:
        rgba(16,21,31,.96);

    border:
        1px solid #252c39;

    border-radius: 20px;

    padding: 17px;

    height:
        calc(100vh - 120px);

    overflow-y: auto;

    scrollbar-width: thin;
}

.sidebar h2 {

    color: #c4cad5;

    font-size: 17px;

    margin-bottom: 15px;

    padding-right: 3px;
}


/* =====================================================
   PACKAGE BUTTON
===================================================== */

.package {

    width: 100%;

    border: 1px solid transparent;

    border-radius: 13px;

    padding: 14px;

    margin-bottom: 9px;

    background:
        #171d28;

    color: white;

    text-align: right;

    cursor: pointer;

    font-size: 14px;

    transition:
        .2s ease;
}

.package:hover {

    background:
        #222a38;
}

.package:focus {

    outline: none;

    border-color:
        #e91542;
}

.package.active {

    background:
        linear-gradient(
            135deg,
            #e91542,
            #c90f36
        );

    box-shadow:
        0 7px 22px
        rgba(233,21,66,.22);
}


/* =====================================================
   CONTENT
===================================================== */

.content {

    flex: 1;

    min-width: 0;

    padding-top: 3px;
}

.content-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 18px;
}

.content h2 {

    font-size: 22px;
}


/* =====================================================
   CHANNEL COUNT
===================================================== */

.channel-count {

    color: #858d9c;

    font-size: 12px;

    background:
        #111722;

    border:
        1px solid #252c39;

    padding: 7px 11px;

    border-radius: 9px;
}


/* =====================================================
   CHANNEL GRID
===================================================== */

.channels {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(205px, 1fr)
        );

    gap: 15px;
}


/* =====================================================
   CHANNEL CARD
===================================================== */

.channel {

    background:
        linear-gradient(
            145deg,
            #131925,
            #0f141e
        );

    border:
        1px solid #242c39;

    border-radius: 17px;

    padding: 17px;

    min-height: 170px;

    cursor: pointer;

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;

    display: flex;

    flex-direction: column;

    justify-content: space-between;
}

.channel:hover {

    transform:
        translateY(-3px);

    border-color:
        #e91542;

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.25);
}

.channel:focus {

    outline:
        3px solid #e91542;

    outline-offset:
        2px;
}


/* =====================================================
   CHANNEL TOP
===================================================== */

.channel-top {

    display: flex;

    align-items: center;

    gap: 12px;
}


/* =====================================================
   CHANNEL LOGO
===================================================== */

.channel-logo {

    width: 58px;

    height: 58px;

    flex-shrink: 0;

    border-radius: 14px;

    background:
        #202735;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    color: #fff;

    font-size: 17px;

    font-weight: bold;
}

.channel-logo img {

    width: 100%;

    height: 100%;

    object-fit: contain;

    padding: 5px;
}


/* =====================================================
   CHANNEL NAME
===================================================== */

.channel-name {

    font-size: 15px;

    font-weight: bold;

    line-height: 1.45;
}


/* =====================================================
   QUALITY AREA
===================================================== */

.quality-title {

    color: #858d9c;

    font-size: 11px;

    margin-top: 15px;

    margin-bottom: 8px;
}

.qualities {

    display: flex;

    flex-wrap: wrap;

    gap: 6px;
}


/* =====================================================
   QUALITY BUTTON
===================================================== */

.quality {

    border:
        1px solid #303949;

    background:
        #1b2230;

    color: #d9dee7;

    border-radius: 8px;

    padding:
        6px 9px;

    font-size: 11px;

    font-weight: bold;

    cursor: pointer;

    transition:
        .15s ease;
}

.quality:hover,
.quality:focus {

    background:
        #e91542;

    border-color:
        #e91542;

    color: white;

    outline: none;
}

.quality:focus {

    box-shadow:
        0 0 0 2px
        rgba(233,21,66,.25);
}


/* =====================================================
   SINGLE QUALITY
===================================================== */

.single-quality {

    margin-top: 15px;

    color: #8f97a6;

    font-size: 11px;
}


/* =====================================================
   EMPTY
===================================================== */

.empty {

    background:
        #111722;

    border:
        1px solid #242c39;

    border-radius: 16px;

    padding: 35px;

    color: #9299a8;

    text-align: center;

    grid-column:
        1 / -1;
}


/* =====================================================
   PLAYER
===================================================== */

.player {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 9999;

    background: #000;

    align-items: center;

    justify-content: center;
}

.player video {

    width: 100%;

    height: 100%;

    object-fit: contain;

    background: #000;
}


/* =====================================================
   CLOSE PLAYER
===================================================== */

.close {

    position: absolute;

    top: 20px;

    right: 20px;

    z-index: 10000;

    background:
        rgba(0,0,0,.75);

    color: white;

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius: 10px;

    padding:
        11px 18px;

    font-size: 14px;

    cursor: pointer;

    backdrop-filter:
        blur(8px);
}

.close:hover,
.close:focus {

    outline:
        2px solid white;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 700px) {

    main {

        flex-direction: column;

        padding: 12px;

    }

    .sidebar {

        width: 100%;

        height: auto;

        max-height: none;
    }

    .channels {

        grid-template-columns:
            repeat(2, 1fr);

    }

    .content-header {

        align-items: flex-start;

        gap: 10px;
    }

}


/* =====================================================
   TV
===================================================== */

@media (min-width: 1000px) {

    .channel {

        min-height: 175px;

    }

    .channel-name {

        font-size: 16px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="logo">
        NT
    </div>

    <div class="title">

        <h1>
            Niyati TV
        </h1>

        <span>
            IPTV Platform
        </span>

    </div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main>


    <!-- =================================================
         SIDEBAR
    ================================================== -->

    <aside class="sidebar">

        <h2>
            الباقات
        </h2>


        <button
            class="package active"
            data-package="bein"
            tabindex="0">

            ⚽ beIN SPORTS

        </button>


        <button
            class="package"
            data-package="alwan"
            tabindex="0">

            🏆 ALWAN SPORT

        </button>


        <button
            class="package"
            data-package="shahid"
            tabindex="0">

            ⭐ SHAHID SPORTS

        </button>


        <button
            class="package"
            data-package="shasha"
            tabindex="0">

            🎯 SHASHA

        </button>


        <button
            class="package"
            data-package="dazn"
            tabindex="0">

            🏎️ DAZN

        </button>


        <button
            class="package"
            data-package="thamanya"
            tabindex="0">

            📺 THAMANYA

        </button>


        <button
            class="package"
            data-package="alkass"
            tabindex="0">

            🏆 ALKASS SPORT

        </button>


        <button
            class="package"
            data-package="ad"
            tabindex="0">

            🇦🇪 AD SPORT

        </button>


        <button
            class="package"
            data-package="dubai"
            tabindex="0">

            📡 DUBAI SPORT

        </button>


        <button
            class="package"
            data-package="iraqia"
            tabindex="0">

            🇮🇶 IRAQIA SPORT

        </button>


    </aside>



    <!-- =================================================
         CONTENT
    ================================================== -->

    <section class="content">

        <div class="content-header">

            <h2 id="packageTitle">
                beIN SPORTS
            </h2>

            <div
                class="channel-count"
                id="channelCount">

                0 قناة

            </div>

        </div>


        <div
            class="channels"
            id="channels">

        </div>

    </section>


</main>



<!-- =====================================================
     PLAYER
===================================================== -->

<div
    class="player"
    id="player">


    <button
        class="close"
        id="closePlayer">

        رجوع

    </button>


    <video
        id="video"
        controls
        playsinline>

    </video>


</div>



<!-- =====================================================
     CHANNEL DATA
===================================================== -->

<script src="channels.js"></script>


<!-- =====================================================
     PLAYER
===================================================== -->

<script src="player.js"></script>



<script>

/* =====================================================
   PACKAGE NAMES
===================================================== */

const packageNames = {

    bein:
        "beIN SPORTS",

    alwan:
        "ALWAN SPORT",

    shahid:
        "SHAHID SPORTS",

    shasha:
        "SHASHA",

    dazn:
        "DAZN",

    thamanya:
        "THAMANYA",

    alkass:
        "ALKASS SPORT",

    ad:
        "AD SPORT",

    dubai:
        "DUBAI SPORT",

    iraqia:
        "IRAQIA SPORT"

};


/* =====================================================
   PACKAGE KEYS
===================================================== */

const packageKeys = {

    bein:
        "beIN SPORTS",

    alwan:
        "ALWAN SPORT",

    shahid:
        "SHAHID SPORTS",

    shasha:
        "SHASHA",

    dazn:
        "DAZN",

    thamanya:
        "THAMANYA",

    alkass:
        "ALKASS SPORT",

    ad:
        "AD SPORT",

    dubai:
        "DUBAI SPORT",

    iraqia:
        "IRAQIA SPORT"

};


/* =====================================================
   GET CHANNELS
===================================================== */

function getChannels() {

    if (
        typeof channels !== "undefined" &&
        Array.isArray(channels)
    ) {

        return channels;

    }

    console.error(
        "channels.js not found"
    );

    return [];

}


/* =====================================================
   SHOW PACKAGE
===================================================== */

function showPackage(packageId) {

    const allChannels =
        getChannels();


    const realPackage =
        packageKeys[packageId];


    const filteredChannels =
        allChannels.filter(

            function(channel) {

                return (
                    channel.package ===
                    realPackage
                );

            }

        );


    const container =
        document.getElementById(
            "channels"
        );


    const title =
        document.getElementById(
            "packageTitle"
        );


    const count =
        document.getElementById(
            "channelCount"
        );


    title.textContent =
        packageNames[packageId];


    count.textContent =
        filteredChannels.length +
        " قناة";


    container.innerHTML = "";


    /* =================================================
       NO CHANNELS
    ================================================= */

    if (
        filteredChannels.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                لا توجد قنوات في هذه الباقة

            </div>

        `;

        return;

    }


    /* =================================================
       CREATE CHANNEL CARDS
    ================================================= */

    filteredChannels.forEach(

        function(channel, index) {


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "channel";


            item.tabIndex = 0;


            /* =========================================
               LOGO
            ========================================= */

            let logoHTML = "";


            if (
                channel.logo
            ) {

                logoHTML = `

                    <img
                        src="${channel.logo}"
                        alt=""
                        loading="lazy"
                        onerror="
                            this.style.display='none';
                            this.parentElement.textContent='${index + 1}';
                        "
                    >

                `;

            }

            else {

                logoHTML =
                    `${index + 1}`;

            }


            /* =========================================
               QUALITY BUTTONS
            ========================================= */

            let qualityHTML = "";


            if (
                Array.isArray(
                    channel.qualities
                ) &&
                channel.qualities.length > 0
            ) {


                if (
                    channel.qualities.length === 1
                ) {

                    qualityHTML = `

                        <div class="single-quality">

                            ${channel.qualities[0].name}

                        </div>

                    `;

                }

                else {

                    qualityHTML = `

                        <div class="quality-title">

                            اختر الجودة

                        </div>

                        <div class="qualities">

                    `;


                    channel.qualities.forEach(

                        function(
                            quality,
                            qualityIndex
                        ) {


                            qualityHTML += `

                                <button
                                    class="quality"
                                    tabindex="0"
                                    data-quality-index="${qualityIndex}">

                                    ${quality.name}

                                </button>

                            `;

                        }

                    );


                    qualityHTML += `

                        </div>

                    `;

                }

            }


            /* =========================================
               CARD HTML
            ========================================= */

            item.innerHTML = `

                <div class="channel-top">

                    <div class="channel-logo">

                        ${logoHTML}

                    </div>

                    <div class="channel-name">

                        ${channel.name}

                    </div>

                </div>

                ${qualityHTML}

            `;


            /* =========================================
               QUALITY BUTTON EVENTS
            ========================================= */

            const qualityButtons =
                item.querySelectorAll(
                    ".quality"
                );


            qualityButtons.forEach(

                function(button) {


                    button.addEventListener(

                        "click",

                        function(event) {

                            event.stopPropagation();


                            const qualityIndex =
                                Number(
                                    this.dataset
                                        .qualityIndex
                                );


                            const selectedQuality =
                                channel.qualities[
                                    qualityIndex
                                ];


                            if (
                                selectedQuality &&
                                selectedQuality.url
                            ) {

                                openChannel(
                                    selectedQuality
                                        .url
                                );

                            }

                        }

                    );


                    button.addEventListener(

                        "keydown",

                        function(event) {


                            if (
                                event.key ===
                                "Enter" ||

                                event.key ===
                                " "
                            ) {

                                event.preventDefault();

                                event.stopPropagation();


                                const qualityIndex =
                                    Number(
                                        this.dataset
                                            .qualityIndex
                                    );


                                const selectedQuality =
                                    channel.qualities[
                                        qualityIndex
                                    ];


                                if (
                                    selectedQuality &&
                                    selectedQuality.url
                                ) {

                                    openChannel(
                                        selectedQuality
                                            .url
                                    );

                                }

                            }

                        }

                    );

                }

            );


            /* =========================================
               CARD CLICK
            ========================================= */

            item.addEventListener(

                "click",

                function(event) {


                    if (
                        event.target
                            .closest(
                                ".quality"
                            )
                    ) {

                        return;

                    }


                    /*
                     * إذا عندنا جودة واحدة
                     * نشغلها مباشرة.
                     */

                    if (
                        Array.isArray(
                            channel.qualities
                        ) &&
                        channel.qualities.length === 1
                    ) {

                        openChannel(
                            channel.qualities[0]
                                .url
                        );

                    }

                }

            );


            /* =========================================
               REMOTE
            ========================================= */

            item.addEventListener(

                "keydown",

                function(event) {


                    if (
                        event.key ===
                        "Enter" ||

                        event.key ===
                        " "
                    ) {


                        /*
                         * إذا التركيز على زر جودة
                         * لا نكرر تشغيل القناة.
                         */

                        if (
                            event.target
                                .classList
                                .contains(
                                    "quality"
                                )
                        ) {

                            return;

                        }


                        event.preventDefault();


                        if (
                            Array.isArray(
                                channel.qualities
                            ) &&
                            channel.qualities.length === 1
                        ) {

                            openChannel(
                                channel.qualities[0]
                                    .url
                            );

                        }

                    }

                }

            );


            container.appendChild(
                item
            );


        }

    );

}


/* =====================================================
   OPEN CHANNEL
===================================================== */

function openChannel(url) {

    if (
        !url
    ) {

        alert(
            "رابط القناة غير موجود"
        );

        return;

    }


    const playerBox =
        document.getElementById(
            "player"
        );


    playerBox.style.display =
        "flex";


    /* =================================================
       PLAYER.JS
    ================================================= */

    if (
        typeof playChannel ===
        "function"
    ) {

        playChannel(
            url
        );

    }

    else {


        const video =
            document.getElementById(
                "video"
            );


        video.src =
            url;


        video.load();


        video.play().catch(

            function(error) {

                console.log(
                    error
                );

            }

        );

    }

}


/* =====================================================
   CLOSE PLAYER
===================================================== */

function closePlayer() {

    const playerBox =
        document.getElementById(
            "player"
        );


    if (
        typeof stopChannel ===
        "function"
    ) {

        stopChannel();

    }

    else {

        const video =
            document.getElementById(
                "video"
            );


        video.pause();


        video.removeAttribute(
            "src"
        );


        video.load();

    }


    playerBox.style.display =
        "none";

}


/* =====================================================
   CLOSE BUTTON
===================================================== */

document
    .getElementById(
        "closePlayer"
    )
    .addEventListener(

        "click",

        function() {

            closePlayer();

        }

    );


/* =====================================================
   PACKAGE BUTTONS
===================================================== */

document
    .querySelectorAll(
        ".package"
    )
    .forEach(

        function(button) {


            button.addEventListener(

                "click",

                function() {


                    document
                        .querySelectorAll(
                            ".package"
                        )
                        .forEach(

                            function(btn) {

                                btn.classList
                                    .remove(
                                        "active"
                                    );

                            }

                        );


                    this.classList.add(
                        "active"
                    );


                    showPackage(
                        this.dataset
                            .package
                    );


                }

            );


        }

    );


/* =====================================================
   TV REMOTE - BACK
===================================================== */

document.addEventListener(

    "keydown",

    function(event) {


        const playerBox =
            document.getElementById(
                "player"
            );


        /* =============================================
           BACK / ESC
        ============================================= */

        if (

            event.key ===
                "Escape" ||

            event.key ===
                "Backspace"

        ) {


            if (
                playerBox.style.display
                === "flex"
            ) {

                closePlayer();

                event.preventDefault();

                return;

            }

        }

    }

);


/* =====================================================
   START APP
===================================================== */

document.addEventListener(

    "DOMContentLoaded",

    function() {

        showPackage(
            "bein"
        );

    }

);

</script>


</body>

</html>
