<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Niyati TV</title>

<style>

/* =========================================================
   NIYATI TV — DESIGN 3
   Vertical TV Interface
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {

    background:
        radial-gradient(
            circle at 75% 5%,
            rgba(38,52,76,.45),
            transparent 35%
        ),
        radial-gradient(
            circle at 15% 90%,
            rgba(20,38,55,.35),
            transparent 38%
        ),
        #06090e;

    color: #fff;

    font-family:
        Arial,
        "Tahoma",
        sans-serif;

    overflow-x: hidden;
}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {
    width: 6px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: #273142;
    border-radius: 20px;
}

::-webkit-scrollbar-thumb:hover {
    background: #3a465a;
}


/* =========================================================
   HEADER
========================================================= */

header {

    height: 76px;

    width: 100%;

    display: flex;

    align-items: center;

    padding: 0 30px;

    background:
        rgba(7,11,18,.94);

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

    position: sticky;

    top: 0;

    z-index: 500;

    backdrop-filter:
        blur(20px);
}


.logo {

    width: 48px;
    height: 48px;

    border-radius: 14px;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #bfc7d4
        );

    color: #070a10;

    font-size: 18px;

    font-weight: 950;

    box-shadow:
        0 8px 25px
        rgba(255,255,255,.08);
}


.title {

    margin-right: 14px;
}


.title h1 {

    font-size: 21px;

    font-weight: 900;

    letter-spacing: .2px;
}


.title span {

    display: block;

    margin-top: 4px;

    color: #667184;

    font-size: 9px;

    font-weight: 700;

    letter-spacing: 1.7px;
}


.header-right {

    margin-right: auto;

    display: flex;

    align-items: center;

    gap: 12px;
}


.live-status {

    display: flex;

    align-items: center;

    gap: 8px;

    padding:
        8px 12px;

    border:
        1px solid
        rgba(255,255,255,.06);

    border-radius: 10px;

    background:
        rgba(255,255,255,.035);

    color: #8993a4;

    font-size: 11px;

    font-weight: 700;
}


.live-status-dot {

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #39d98a;

    box-shadow:
        0 0 12px
        rgba(57,217,138,.8);
}


/* =========================================================
   MAIN
========================================================= */

main {

    display: grid;

    grid-template-columns:
        245px
        minmax(0, 1fr);

    gap: 20px;

    padding: 20px 24px 30px;

    min-height:
        calc(100vh - 76px);
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {

    width: 245px;

    min-width: 245px;

    height:
        calc(100vh - 120px);

    position: sticky;

    top: 96px;

    overflow-y: auto;

    padding: 15px 12px;

    border:
        1px solid
        rgba(255,255,255,.065);

    border-radius: 18px;

    background:
        linear-gradient(
            180deg,
            rgba(18,24,34,.98),
            rgba(9,13,20,.98)
        );

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.25);
}


.sidebar-head {

    padding:
        4px 9px 15px;

    color: #e8ebf1;

    font-size: 14px;

    font-weight: 900;
}


.sidebar-head small {

    display: block;

    color: #596476;

    font-size: 9px;

    font-weight: 500;

    margin-top: 5px;
}


/* =========================================================
   PACKAGE BUTTON
========================================================= */

.package {

    width: 100%;

    min-height: 50px;

    margin-bottom: 7px;

    padding:
        0 13px;

    display: flex;

    align-items: center;

    gap: 11px;

    border:
        1px solid
        transparent;

    border-radius: 12px;

    background:
        rgba(255,255,255,.035);

    color: #aeb7c5;

    text-align: right;

    font-family: inherit;

    font-size: 12px;

    font-weight: 800;

    cursor: pointer;

    transition:
        .16s ease;
}


.package-icon {

    width: 28px;
    height: 28px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 8px;

    background:
        rgba(255,255,255,.06);

    font-size: 13px;
}


.package-name {

    flex: 1;
}


.package-arrow {

    color: #4f5b6d;

    font-size: 13px;

    transition: .16s ease;
}


.package:hover {

    color: #fff;

    background:
        rgba(255,255,255,.075);
}


.package:focus {

    outline: none;

    border-color:
        #fff;

    box-shadow:
        0 0 0 3px
        rgba(255,255,255,.12);

    color: #fff;
}


.package:focus .package-arrow {

    color: #fff;
}


.package.active {

    color: #fff;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #dce1e8
        );

    border-color:
        rgba(255,255,255,.6);

    box-shadow:
        0 9px 28px
        rgba(0,0,0,.25);
}


.package.active .package-icon {

    background:
        rgba(0,0,0,.10);

    color: #070a10;
}


.package.active .package-arrow {

    color: #111820;
}


/* =========================================================
   CONTENT
========================================================= */

.content {

    min-width: 0;

    display: flex;

    flex-direction: column;

    gap: 16px;
}


/* =========================================================
   PLAYER AREA
========================================================= */

.player-panel {

    width: 100%;

    min-height: 315px;

    padding: 13px;

    border:
        1px solid
        rgba(255,255,255,.075);

    border-radius: 19px;

    background:
        linear-gradient(
            145deg,
            rgba(19,27,39,.98),
            rgba(8,12,18,.98)
        );

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.25);

    display: flex;

    gap: 15px;
}


/* =========================================================
   VIDEO
========================================================= */

.video-container {

    flex: 1;

    min-width: 0;

    min-height: 287px;

    position: relative;

    overflow: hidden;

    border-radius: 14px;

    background: #000;

    border:
        1px solid
        rgba(255,255,255,.08);
}


.video-container video {

    width: 100%;
    height: 100%;

    min-height: 287px;

    display: block;

    object-fit: contain;

    background: #000;
}


.player-empty {

    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    pointer-events: none;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.035),
            transparent 55%
        );
}


.player-empty-logo {

    width: 62px;
    height: 62px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 18px;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid
        rgba(255,255,255,.09);

    color: #fff;

    font-size: 21px;

    font-weight: 950;

    margin-bottom: 12px;
}


.player-empty-title {

    color: #aab3c1;

    font-size: 13px;

    font-weight: 800;
}


.player-empty-sub {

    margin-top: 6px;

    color: #505b6b;

    font-size: 10px;
}


/* =========================================================
   PLAYER INFO
========================================================= */

.player-info {

    width: 245px;

    flex-shrink: 0;

    padding: 15px 13px;

    display: flex;

    flex-direction: column;

    justify-content: space-between;
}


.player-info-top {

    display: flex;

    align-items: center;

    gap: 9px;
}


.player-live {

    padding:
        5px 8px;

    border-radius: 7px;

    background:
        rgba(255,255,255,.06);

    color: #8994a5;

    font-size: 9px;

    font-weight: 900;
}


.player-info h2 {

    margin-top: 18px;

    color: #fff;

    font-size: 20px;

    line-height: 1.4;

    font-weight: 900;
}


.player-info-desc {

    margin-top: 7px;

    color: #626e80;

    font-size: 10px;

    line-height: 1.7;
}


.player-hint {

    margin-top: auto;

    padding-top: 20px;
}


.hint-row {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-top: 8px;

    color: #596577;

    font-size: 9px;
}


.key {

    min-width: 25px;
    height: 25px;

    display: flex;

    align-items: center;
    justify-content: center;

    border:
        1px solid
        rgba(255,255,255,.09);

    border-radius: 7px;

    background:
        rgba(255,255,255,.045);

    color: #d4dae3;

    font-size: 10px;

    font-weight: 900;
}


/* =========================================================
   CHANNEL HEADER
========================================================= */

.channel-section {

    min-width: 0;

    padding:
        2px 2px 0;
}


.content-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 12px;
}


.content-title {

    display: flex;

    align-items: center;

    gap: 10px;
}


.content-title h2 {

    font-size: 19px;

    font-weight: 900;
}


.live-dot {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #fff;

    box-shadow:
        0 0 13px
        rgba(255,255,255,.8);
}


.channel-count {

    padding:
        7px 11px;

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius: 8px;

    background:
        rgba(255,255,255,.035);

    color: #687487;

    font-size: 10px;

    font-weight: 700;
}


/* =========================================================
   CHANNEL LIST
========================================================= */

.channels {

    display: flex;

    flex-direction: column;

    gap: 7px;
}


/* =========================================================
   CHANNEL ROW
========================================================= */

.channel {

    width: 100%;

    min-height: 76px;

    padding:
        8px 12px;

    display: flex;

    align-items: center;

    gap: 13px;

    position: relative;

    border:
        1px solid
        rgba(255,255,255,.055);

    border-radius: 13px;

    background:
        linear-gradient(
            90deg,
            rgba(18,25,36,.98),
            rgba(11,16,24,.98)
        );

    cursor: pointer;

    transition:
        .16s ease;
}


.channel:hover {

    background:
        linear-gradient(
            90deg,
            rgba(29,38,52,.98),
            rgba(14,20,29,.98)
        );

    border-color:
        rgba(255,255,255,.16);

    transform:
        translateX(-3px);
}


.channel:focus {

    outline: none;

    border-color:
        #fff;

    box-shadow:
        0 0 0 3px
        rgba(255,255,255,.12);

    transform:
        translateX(-4px);
}


.channel.active {

    border-color:
        rgba(255,255,255,.25);

    background:
        linear-gradient(
            90deg,
            rgba(35,43,56,.98),
            rgba(15,21,30,.98)
        );
}


/* =========================================================
   CHANNEL NUMBER
========================================================= */

.channel-number {

    width: 28px;

    flex-shrink: 0;

    text-align: center;

    color: #536072;

    font-size: 11px;

    font-weight: 900;
}


/* =========================================================
   CHANNEL LOGO
========================================================= */

.channel-logo {

    width: 54px;
    height: 54px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius: 11px;

    background:
        linear-gradient(
            145deg,
            #273142,
            #151c27
        );

    color: #fff;

    font-size: 15px;

    font-weight: 900;
}


.channel-logo img {

    width: 100%;
    height: 100%;

    padding: 6px;

    object-fit: contain;
}


/* =========================================================
   CHANNEL INFORMATION
========================================================= */

.channel-main {

    min-width: 0;

    flex: 1;
}


.channel-name {

    color: #edf0f5;

    font-size: 13px;

    font-weight: 900;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.channel-sub {

    margin-top: 5px;

    color: #566173;

    font-size: 9px;
}


/* =========================================================
   QUALITY
========================================================= */

.channel-quality {

    flex-shrink: 0;

    display: flex;

    align-items: center;

    gap: 5px;
}


.quality {

    min-width: 37px;

    height: 27px;

    padding:
        0 8px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 7px;

    background:
        rgba(255,255,255,.04);

    color: #a9b2c0;

    font-family: inherit;

    font-size: 8px;

    font-weight: 900;

    cursor: pointer;
}


.quality:hover,
.quality:focus {

    outline: none;

    background:
        #fff;

    border-color:
        #fff;

    color: #080b10;

    box-shadow:
        0 0 0 3px
        rgba(255,255,255,.1);
}


.single-quality {

    padding:
        7px 10px;

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius: 7px;

    color: #657183;

    font-size: 8px;

    font-weight: 900;
}


/* =========================================================
   PLAY INDICATOR
========================================================= */

.play-indicator {

    width: 34px;
    height: 34px;

    flex-shrink: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        rgba(255,255,255,.05);

    color: #aeb6c3;

    font-size: 12px;
}


.channel:hover .play-indicator,
.channel:focus .play-indicator {

    background:
        #fff;

    color: #070a0e;
}


/* =========================================================
   EMPTY
========================================================= */

.empty {

    min-height: 180px;

    display: flex;

    align-items: center;
    justify-content: center;

    flex-direction: column;

    border:
        1px solid
        rgba(255,255,255,.06);

    border-radius: 14px;

    background:
        rgba(255,255,255,.025);

    color: #657083;

    font-size: 12px;
}


.empty-icon {

    font-size: 28px;

    margin-bottom: 10px;

    opacity: .5;
}


/* =========================================================
   FULLSCREEN PLAYER
========================================================= */

.player {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 9999;

    align-items: center;

    justify-content: center;

    background: #000;
}


.player video {

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;
}


.close {

    position: absolute;

    top: 20px;

    right: 20px;

    z-index: 10001;

    min-width: 72px;

    height: 40px;

    padding:
        0 15px;

    border:
        1px solid
        rgba(255,255,255,.18);

    border-radius: 9px;

    background:
        rgba(0,0,0,.72);

    color: #fff;

    font-family: inherit;

    font-size: 11px;

    font-weight: 800;

    cursor: pointer;

    backdrop-filter:
        blur(15px);
}


.close:hover,
.close:focus {

    outline: none;

    background: #fff;

    color: #000;

    border-color: #fff;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 1000px) {

    main {

        grid-template-columns:
            205px
            minmax(0,1fr);

        padding: 15px;

    }

    .sidebar {

        width: 205px;

        min-width: 205px;
    }

    .player-info {

        width: 190px;
    }

}


@media (max-width: 760px) {

    header {

        height: 68px;

        padding: 0 15px;
    }

    main {

        display: flex;

        flex-direction: column;

        padding: 12px;
    }

    .sidebar {

        position: static;

        width: 100%;

        min-width: 0;

        height: auto;

        max-height: 220px;
    }

    .player-panel {

        flex-direction: column;
    }

    .video-container {

        width: 100%;

        min-height: 240px;
    }

    .player-info {

        width: 100%;

        min-height: 150px;
    }

}


@media (max-width: 520px) {

    .header-right {

        display: none;
    }

    .channel {

        min-height: 68px;

        padding: 7px;
    }

    .channel-number {

        display: none;
    }

    .channel-logo {

        width: 46px;
        height: 46px;
    }

    .channel-quality {

        display: none;
    }

    .channel-name {

        font-size: 12px;
    }

}


/* =========================================================
   TV / GOOGLE TV
========================================================= */

@media (min-width: 1200px) {

    main {

        grid-template-columns:
            250px
            minmax(0,1fr);

        gap: 22px;

        padding:
            22px 30px 35px;
    }

    .sidebar {

        width: 250px;

        min-width: 250px;
    }

    .channel {

        min-height: 80px;

        padding:
            9px 15px;
    }

    .channel-name {

        font-size: 14px;
    }

    .channel-logo {

        width: 58px;
        height: 58px;
    }

}


/* =========================================================
   FOCUS MODE FOR TV
========================================================= */

.tv-focus {

    border-color: #fff !important;

    box-shadow:
        0 0 0 3px
        rgba(255,255,255,.15),
        0 14px 35px
        rgba(0,0,0,.3) !important;
}

</style>
</head>


<body>

        <button

        <button

            </span>

        </button>


        <button

                IQ
            </span>

                IRAQIA SPORT
            </span>

            <span class="package-arrow">

            </span>

        </button>

    </aside>


    <!-- =====================================================
         CONTENT
    ====================================================== -->

    <section class="content">


        <!-- =================================================
             PLAYER PANEL
        ================================================== -->

        <section class="player-panel">


            <div class="video-container">

                <video
                    id="video"
                    playsinline>
                </video>


                <div
                    class="player-empty"
                    id="playerEmpty">

                    <div class="player-empty-logo">
                        NT
                    </div>

                    <div class="player-empty-title">
                        Niyati TV
                    </div>

                    <div class="player-empty-sub">
                        اختر قناة لبدء المشاهدة
                    </div>

                </div>

            </div>


            <div class="player-info">

                <div>

                    <div class="player-info-top">

                        <div class="player-live">
                            LIVE
                        </div>

                        <span
                            style="
                            color:#596476;
                            font-size:9px;
                            font-weight:700;
                            ">
                            البث المباشر
                        </span>

                    </div>


                    <h2 id="nowPlayingTitle">
                        لم يتم اختيار قناة
                    </h2>


                    <div
                        class="player-info-desc"
                        id="nowPlayingDesc">

                        اختر أي قناة من القائمة
                        لبدء المشاهدة.

                    </div>

                </div>


                <div class="player-hint">

                    <div class="hint-row">

                        <span class="key">
                            ↑↓
                        </span>

                        <span>
                            التنقل بين القنوات
                        </span>

                    </div>


                    <div class="hint-row">

                        <span class="key">
                            OK
                        </span>

                        <span>
                            تشغيل القناة
                        </span>

                    </div>


                    <div class="hint-row">

                        <span class="key">
                            BACK
                        </span>

                        <span>
                            الرجوع
                        </span>

                    </div>

                </div>

            </div>

        </section>


        <!-- =================================================
             CHANNEL SECTION
        ================================================== -->

        <section class="channel-section">

            <div class="content-header">

                <div class="content-title">

                    <span class="live-dot"></span>

                    <h2 id="packageTitle">
                        beIN SPORTS
                    </h2>

                </div>


                <div
                    class="channel-count"
                    id="channelCount">

                    0 قناة

                </div>

            </div>


            <div
                class="channels"
                id="channels">
            </div>

        </section>

    </section>

</main>


<!-- =========================================================
     FULLSCREEN PLAYER
========================================================= -->

<div
    class="player"
    id="player">

    <button
        class="close"
        id="closePlayer">

        رجوع

    </button>

    <!--
        نفس video ID القديم حتى يبقى player.js
        متوافقاً مع التطبيق
    -->

</div>


<!-- =========================================================
     CHANNEL DATA
========================================================= -->

<script src="channels.js"></script>


<!-- =========================================================
     PLAYER ENGINE
========================================================= -->

<script src="player.js"></script>


<script>

/* =========================================================
   PACKAGE NAMES
========================================================= */

const packageNames = {

    bein: "beIN SPORTS",

    alwan: "ALWAN SPORT",

    shahid: "SHAHID SPORTS",

    shasha: "SHASHA",

    dazn: "DAZN",

    thamanya: "THAMANYA",

    alkass: "ALKASS SPORT",

    ad: "AD SPORT",

    dubai: "DUBAI SPORT",

    iraqia: "IRAQIA SPORT"

};


/* =========================================================
   PACKAGE KEYS
========================================================= */

const packageKeys = {

    bein: "beIN SPORTS",

    alwan: "ALWAN SPORT",

    shahid: "SHAHID SPORTS",

    shasha: "SHASHA",

    dazn: "DAZN",

    thamanya: "THAMANYA",

    alkass: "ALKASS SPORT",

    ad: "AD SPORT",

    dubai: "DUBAI SPORT",

    iraqia: "IRAQIA SPORT"

};


/* =========================================================
   GET CHANNELS
========================================================= */

function getChannels() {

    if (
        typeof channels !== "undefined" &&
        Array.isArray(channels)
    ) {

        return channels;

    }

    console.error(
        "channels.js not found"
    );

    return [];

}


/* =========================================================
   SHOW PACKAGE
========================================================= */

function showPackage(packageId) {

    const allChannels =
        getChannels();


    const realPackage =
        packageKeys[packageId];


    const filteredChannels =
        allChannels.filter(
            function(channel) {

                return (
                    channel.package ===
                    realPackage
                );

            }
        );


    const container =
        document.getElementById(
            "channels"
        );


    const title =
        document.getElementById(
            "packageTitle"
        );


    const count =
        document.getElementById(
            "channelCount"
        );


    title.textContent =
        packageNames[packageId] ||
        packageId;


    count.textContent =
        filteredChannels.length +
        " قناة";


    container.innerHTML = "";


    if (
        filteredChannels.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    TV
                </div>

                <div>
                    لا توجد قنوات في هذه الباقة
                </div>

            </div>

        `;

        return;

    }


    filteredChannels.forEach(

        function(channel, index) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "channel";


            item.tabIndex =
                0;


            /* =============================================
               NUMBER
            ============================================== */

            const number =
                document.createElement(
                    "div"
                );

            number.className =
                "channel-number";

            number.textContent =
                String(index + 1)
                    .padStart(2, "0");


            /* =============================================
               LOGO
            ============================================== */

            const logo =
                document.createElement(
                    "div"
                );

            logo.className =
                "channel-logo";


            if (channel.logo) {

                const image =
                    document.createElement(
                        "img"
                    );

                image.src =
                    channel.logo;

                image.alt = "";


                image.onerror =
                    function() {

                        image.remove();

                        logo.textContent =
                            String(index + 1);

                    };


                logo.appendChild(
                    image
                );

            }

            else {

                logo.textContent =
                    String(index + 1);

            }


            /* =============================================
               INFORMATION
            ============================================== */

            const information =
                document.createElement(
                    "div"
                );

            information.className =
                "channel-main";


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "channel-name";

            name.textContent =
                channel.name ||
                "قناة";


            const sub =
                document.createElement(
                    "div"
                );

            sub.className =
                "channel-sub";

            sub.textContent =
                "بث مباشر • Niyati TV";


            information.appendChild(
                name
            );

            information.appendChild(
                sub
            );


            /* =============================================
               QUALITY
            ============================================== */

            const qualityBox =
                document.createElement(
                    "div"
                );

            qualityBox.className =
                "channel-quality";


            if (
                Array.isArray(
                    channel.qualities
                ) &&
                channel.qualities.length > 0
            ) {

                if (
                    channel.qualities.length === 1
                ) {

                    const quality =
                        document.createElement(
                            "div"
                        );

                    quality.className =
                        "single-quality";

                    quality.textContent =
                        channel.qualities[0].name;

                    qualityBox.appendChild(
                        quality
                    );

                }

                else {

                    channel.qualities.forEach(

                        function(
                            qualityData,
                            qualityIndex
                        ) {

                            const button =
                                document.createElement(
                                    "button"
                                );


                            button.className =
                                "quality";

                            button.tabIndex =
                                0;


                            button.textContent =
                                qualityData.name;


                            button.dataset
                                .qualityIndex =
                                qualityIndex;


                            button.addEventListener(

                                "click",

                                function(event) {

                                    event.stopPropagation();


                                    const selected =
                                        channel.qualities[
                                            Number(
                                                this.dataset
                                                    .qualityIndex
                                            )
                                        ];


                                    if (
                                        selected &&
                                        selected.url
                                    ) {

                                        playSelectedChannel(
                                            selected.url,
                                            channel.name
                                        );

                                    }

                                }

                            );


                            button.addEventListener(

                                "keydown",

                                function(event) {

                                    if (
                                        event.key ===
                                            "Enter" ||
                                        event.key ===
                                            " "
                                    ) {

                                        event.preventDefault();

                                        event.stopPropagation();

                                        this.click();

                                    }

                                }

                            );


                            qualityBox.appendChild(
                                button
                            );

                        }

                    );

                }

            }


            /* =============================================
               PLAY INDICATOR
            ============================================== */

            const play =
                document.createElement(
                    "div"
                );

            play.className =
                "play-indicator";

            play.textContent =
                "▶";


            /* =============================================
               BUILD ROW
            ============================================== */

            item.appendChild(
                number
            );

            item.appendChild(
                logo
            );

            item.appendChild(
                information
            );

            item.appendChild(
                qualityBox
            );

            item.appendChild(
                play
            );


            /* =============================================
               CLICK
            ============================================== */

            item.addEventListener(

                "click",

                function(event) {

                    if (
                        event.target.closest(
                            ".quality"
                        )
                    ) {

                        return;

                    }


                    if (
                        Array.isArray(
                            channel.qualities
                        ) &&
                        channel.qualities.length > 0
                    ) {

                        playSelectedChannel(
                            channel.qualities[0].url,
                            channel.name
                        );

                    }

                }

            );


            /* =============================================
               REMOTE OK
            ============================================== */

            item.addEventListener(

                "keydown",

                function(event) {

                    if (
                        event.key === "Enter" ||
                        event.key === " "
                    ) {

                        if (
                            event.target.closest(
                                ".quality"
                            )
                        ) {

                            return;

                        }


                        event.preventDefault();


                        if (
                            Array.isArray(
                                channel.qualities
                            ) &&
                            channel.qualities.length > 0
                        ) {

                            playSelectedChannel(
                                channel.qualities[0].url,
                                channel.name
                            );

                        }

                    }

                }

            );


            container.appendChild(
                item
            );

        }

    );


    /* =============================================
       FIRST CHANNEL FOCUS
    ============================================== */

    const first =
        container.querySelector(
            ".channel"
        );


    if (first) {

        first.focus();

    }

}


/* =========================================================
   PLAY SELECTED CHANNEL
========================================================= */

function playSelectedChannel(
    url,
    channelName
) {

    if (!url) {

        return;

    }


    const title =
        document.getElementById(
            "nowPlayingTitle"
        );


    const description =
        document.getElementById(
            "nowPlayingDesc"
        );


    const empty =
        document.getElementById(
            "playerEmpty"
        );


    if (title) {

        title.textContent =
            channelName ||
            "القناة";

    }


    if (description) {

        description.textContent =
            "جاري تشغيل البث المباشر";

    }


    if (empty) {

        empty.style.display =
            "none";

    }


    openChannel(url);

}


/* =========================================================
   OPEN CHANNEL
========================================================= */

function openChannel(url) {

    if (!url) {

        alert(
            "رابط القناة غير موجود"
        );

        return;

    }


    const playerBox =
        document.getElementById(
            "player"
        );


    /*
       نخلي الـ player القديم
       متوافقاً مع player.js
    */

    if (
        typeof playChannel ===
        "function"
    ) {

        playChannel(
            url
        );

    }

    else {

        const video =
            document.getElementById(
                "video"
            );


        if (!video) {

            return;

        }


        video.src =
            url;

        video.load();


        video.play().catch(
            function(error) {

                console.log(
                    error
                );

            }
        );

    }

}


/* =========================================================
   CLOSE PLAYER
========================================================= */

function closePlayer() {

    const playerBox =
        document.getElementById(
            "player"
        );


    if (
        typeof stopChannel ===
        "function"
    ) {

        stopChannel();

    }

    else {

        const video =
            document.getElementById(
                "video"
            );


        if (video) {

            video.pause();

            video.removeAttribute(
                "src"
            );

            video.load();

        }

    }


    playerBox.style.display =
        "none";


    const empty =
        document.getElementById(
            "playerEmpty"
        );


    if (empty) {

        empty.style.display =
            "flex";

    }

}


/* =========================================================
   CLOSE BUTTON
========================================================= */

document
    .getElementById(
        "closePlayer"
    )
    .addEventListener(

        "click",

        function() {

            closePlayer();

        }

    );


/* =========================================================
   PACKAGE BUTTONS
========================================================= */

document
    .querySelectorAll(
        ".package"
    )
    .forEach(

        function(button) {

            button.addEventListener(

                "click",

                function() {

                    document
                        .querySelectorAll(
                            ".package"
                        )
                        .forEach(

                            function(btn) {

                                btn.classList
                                    .remove(
                                        "active"
                                    );

                            }

                        );


                    this.classList.add(
                        "active"
                    );


                    showPackage(
                        this.dataset.package
                    );

                }

            );

        }

    );


/* =========================================================
   TV REMOTE NAVIGATION
========================================================= */

document.addEventListener(

    "keydown",

    function(event) {

        const playerBox =
            document.getElementById(
                "player"
            );


        /* =============================================
           BACK / ESCAPE
        ============================================== */

        if (
            event.key === "Escape" ||
            event.key === "Backspace" ||
            event.key === "BrowserBack"
        ) {

            if (
                playerBox &&
                playerBox.style.display ===
                "flex"
            ) {

                closePlayer();

                event.preventDefault();

                return;

            }

        }


        /* =============================================
           ARROW NAVIGATION
        ============================================== */

        const active =
            document.activeElement;


        if (!active) {

            return;

        }


        /* =============================================
           CHANNEL UP / DOWN
        ============================================== */

        if (
            active.classList.contains(
                "channel"
            )
        ) {

            if (
                event.key === "ArrowDown"
            ) {

                const next =
                    active.nextElementSibling;


                if (
                    next &&
                    next.classList.contains(
                        "channel"
                    )
                ) {

                    next.focus();

                    event.preventDefault();

                }

                return;

            }


            if (
                event.key === "ArrowUp"
            ) {

                const previous =
                    active.previousElementSibling;


                if (
                    previous &&
                    previous.classList.contains(
                        "channel"
                    )
                ) {

                    previous.focus();

                    event.preventDefault();

                }

                return;

            }


            /* =========================================
               LEFT → PACKAGES
            ========================================== */

            if (
                event.key === "ArrowLeft"
            ) {

                const firstPackage =
                    document.querySelector(
                        ".package"
                    );


                if (firstPackage) {

                    firstPackage.focus();

                    event.preventDefault();

                }

                return;

            }

        }


        /* =============================================
           PACKAGE NAVIGATION
        ============================================== */

        if (
            active.classList.contains(
                "package"
            )
        ) {

            if (
                event.key === "ArrowDown"
            ) {

                const next =
                    active.nextElementSibling;


                if (
                    next &&
                    next.classList.contains(
                        "package"
                    )
                ) {

                    next.focus();

                    event.preventDefault();

                }

                return;

            }


            if (
                event.key === "ArrowUp"
            ) {

                const previous =
                    active.previousElementSibling;


                if (
                    previous &&
                    previous.classList.contains(
                        "package"
                    )
                ) {

                    previous.focus();

                    event.preventDefault();

                }

                return;

            }


            /* =========================================
               RIGHT → CHANNELS
            ========================================== */

            if (
                event.key === "ArrowRight"
            ) {

                showPackage(
                    active.dataset.package
                );


                const firstChannel =
                    document.querySelector(
                        ".channel"
                    );


                if (firstChannel) {

                    firstChannel.focus();

                }

                event.preventDefault();

                return;

            }

        }


        /* =============================================
           QUALITY NAVIGATION
        ============================================== */

        if (
            active.classList.contains(
                "quality"
            )
        ) {

            if (
                event.key === "ArrowDown" ||
                event.key === "ArrowUp"
            ) {

                const channel =
                    active.closest(
                        ".channel"
                    );


                if (channel) {

                    const target =
                        event.key ===
                        "ArrowDown"
                            ? channel.nextElementSibling
                            : channel.previousElementSibling;


                    if (
                        target &&
                        target.classList.contains(
                            "channel"
                        )
                    ) {

                        target.focus();

                        event.preventDefault();

                    }

                }

            }

        }

    }

);


/* =========================================================
   KEEP PLAYER INFO UPDATED
========================================================= */

document.addEventListener(
    "click",
    function(event) {

        const channel =
            event.target.closest(
                ".channel"
            );


        if (!channel) {

            return;

        }


        document
            .querySelectorAll(
                ".channel.active"
            )
            .forEach(
                function(item) {

                    item.classList.remove(
                        "active"
                    );

                }
            );


        channel.classList.add(
            "active"
        );

    }
);


/* =========================================================
   START APPLICATION
========================================================= */

document.addEventListener(

    "DOMContentLoaded",

    function() {

        showPackage(
            "bein"
        );


        const firstPackage =
            document.querySelector(
                ".package.active"
            );


        if (firstPackage) {

            firstPackage.focus();

        }

    }

);

</script>
